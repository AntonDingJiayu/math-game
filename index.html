<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Math PK Arena · Solo</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237f5af0'/%3E%3Cstop offset='1' stop-color='%232cb67d'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='22' fill='%230a0a1a'/%3E%3Ctext x='50' y='68' font-size='56' text-anchor='middle' font-weight='bold' fill='url(%23g)'%3E%3D%3C/text%3E%3C/svg%3E">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a1a;--bg2:#1a1a3e;--bg3:#0f0c29;
  --card:rgba(255,255,255,.06);--card-border:rgba(255,255,255,.1);
  --card-border-hover:rgba(255,255,255,.2);
  --accent:#7f5af0;--accent2:#2cb67d;--danger:#e53170;--warn:#f9c74f;
  --text:#fffffe;--text2:#94a1b2;--text3:#6b7280;
  --radius:18px;--shadow:0 8px 32px rgba(0,0,0,.4);
}
body{
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;
  display:flex;justify-content:center;align-items:center;position:relative;
}
.bg-orbs{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-2;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.35;animation:floatOrb 20s infinite ease-in-out}
.orb:nth-child(1){width:400px;height:400px;background:radial-gradient(circle,var(--accent),transparent 70%);top:-10%;left:-10%;animation-delay:0s}
.orb:nth-child(2){width:350px;height:350px;background:radial-gradient(circle,var(--accent2),transparent 70%);top:50%;right:-10%;animation-delay:-5s}
.orb:nth-child(3){width:300px;height:300px;background:radial-gradient(circle,#f9c74f30,transparent 70%);bottom:-10%;left:30%;animation-delay:-10s}
.orb:nth-child(4){width:250px;height:250px;background:radial-gradient(circle,#e5317040,transparent 70%);top:30%;left:50%;animation-delay:-15s}
@keyframes floatOrb{0%,100%{transform:translate(0,0) scale(1)}25%{transform:translate(50px,-50px) scale(1.1)}50%{transform:translate(-30px,60px) scale(.95)}75%{transform:translate(60px,30px) scale(1.05)}}
.bg-grid{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;
  background-image:radial-gradient(rgba(255,255,255,.04) 1px,transparent 1px);
  background-size:40px 40px;pointer-events:none}
.particles{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none;overflow:hidden}
.particle{position:absolute;width:3px;height:3px;background:rgba(255,255,255,.25);border-radius:50%;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(100vh) translateX(0) scale(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-10vh) translateX(100px) scale(1);opacity:0}}
.screen{display:none;width:100%;max-width:540px;padding:20px;animation:fadeIn .5s cubic-bezier(.22,1,.36,1)}
.screen.active{display:flex;flex-direction:column;align-items:center;gap:20px}
@keyframes fadeIn{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes shakeX{0%,100%{transform:translateX(0)}15%,45%,75%{transform:translateX(-5px)}30%,60%,90%{transform:translateX(5px)}}
@keyframes scaleIn{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes gradientShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
h1{
  font-size:2.2rem;font-weight:900;
  background:linear-gradient(135deg,#7f5af0,#2cb67d,#f9c74f,#7f5af0);
  background-size:300% 300%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  text-align:center;line-height:1.2;animation:gradientShift 4s ease infinite,float 3s ease-in-out infinite;
  filter:drop-shadow(0 0 20px rgba(127,90,240,.3));
}
h2{font-size:1.5rem;text-align:center;animation:slideUp .5s ease}
.subtitle{color:var(--text2);font-size:.95rem;text-align:center;margin-top:-6px;animation:slideUp .5s ease .1s both}
.card{
  background:var(--card);border:1px solid var(--card-border);
  border-radius:var(--radius);padding:28px;width:100%;
  backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.05);
  transition:all .3s cubic-bezier(.22,1,.36,1);position:relative;overflow:hidden;
}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent)}
.card:hover{border-color:var(--card-border-hover);box-shadow:var(--shadow),0 0 30px rgba(127,90,240,.1),inset 0 1px 0 rgba(255,255,255,.08)}
.btn{
  border:none;border-radius:14px;padding:15px 30px;font-size:1rem;font-weight:700;
  cursor:pointer;transition:all .25s cubic-bezier(.22,1,.36,1);width:100%;letter-spacing:.5px;
  position:relative;overflow:hidden;
}
.btn::after{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);transition:left .5s}
.btn:hover::after{left:100%}
.btn-primary{background:linear-gradient(135deg,var(--accent),#6b4fe0);color:#fff;box-shadow:0 4px 15px rgba(127,90,240,.3)}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 6px 25px rgba(127,90,240,.45)}
.btn-primary:active{transform:translateY(-1px) scale(.98)}
.btn-secondary{background:rgba(255,255,255,.08);color:var(--text);border:1px solid var(--card-border)}
.btn-secondary:hover{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.2);transform:translateY(-2px)}
.btn-secondary:active{transform:translateY(0) scale(.98)}
.btn:active{transform:scale(.97)}
input[type=text],input[type=number]{
  width:100%;padding:15px 18px;border-radius:14px;border:1px solid var(--card-border);
  background:rgba(255,255,255,.05);color:#fff;font-size:1.1rem;outline:none;
  transition:all .25s;text-align:center;box-shadow:inset 2px 4px rgba(0,0,0,.1);
}
input[type=text]:focus,input[type=number]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(127,90,240,.15),inset 0 2px 4px rgba(0,0,0,.1);background:rgba(255,255,255,.08)}
input::placeholder{color:var(--text3)}
.sound-btn{
  position:fixed;top:20px;right:20px;z-index:99;
  width:48px;height:48px;border-radius:50%;border:1px solid var(--card-border);
  background:var(--card);backdrop-filter:blur(12px);cursor:pointer;
  font-size:1.4rem;display:flex;align-items:center;justify-content:center;
  transition:all .3s;box-shadow:0 4px 12px rgba(0,0,0,.2);
}
.sound-btn:hover{background:rgba(255,255,255,.12);transform:scale(1.1);box-shadow:0 6px 20px rgba(0,0,0,.3)}
.brand{position:fixed;top:22px;left:24px;z-index:99;font-size:.8rem;font-weight:700;color:rgba(255,255,255,.35);letter-spacing:.8px;user-select:none}
.q-card{text-align:center;padding:36px 28px;border:1px solid var(--card-border);background:linear-gradient(135deg,rgba(127,90,240,.05),rgba(44,182,125,.05))}
.q-card.new-q{animation:scaleIn .3s ease}
.q-text{font-size:2rem;font-weight:800;line-height:1.4;margin:16px 0 24px;word-break:break-word;min-height:60px;display:flex;align-items:center;justify-content:center}
.tags{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.tag{padding:5px 14px;border-radius:20px;font-size:.8rem;font-weight:700;letter-spacing:.5px}
.tag-arithmetic{background:rgba(127,90,240,.2);color:#b4a0ff;border:1px solid rgba(127,90,240,.2)}
.tag-algebra{background:rgba(44,182,125,.2);color:#6ee7b7;border:1px solid rgba(44,182,125,.2)}
.tag-word{background:rgba(249,199,79,.15);color:#f9c74f;border:1px solid rgba(249,199,79,.2)}
.tag-frac{background:rgba(255,100,150,.15);color:#ff94b8;border:1px solid rgba(255,100,150,.2)}
.tag-percent{background:rgba(255,160,80,.15);color:#ffc080;border:1px solid rgba(255,160,80,.2)}
.tag-geo{background:rgba(120,180,255,.15);color:#90c8ff;border:1px solid rgba(120,180,255,.2)}
.tag-prob{background:rgba(180,120,255,.15);color:#c8a0ff;border:1px solid rgba(180,120,255,.2)}
.tag-diff{background:rgba(255,255,255,.08);color:var(--text2);border:1px solid rgba(255,255,255,.1)}
.fb{margin-top:14px;padding:14px 18px;border-radius:14px;font-weight:700;text-align:center;font-size:1rem;opacity:0;transition:all .3s}
.fb.show{opacity:1;animation:slideUp .3s ease}
.fb.correct{background:rgba(44,182,125,.12);color:#6ee7b7;border:1px solid rgba(44,182,125,.25)}
.fb.wrong{background:rgba(229,49,112,.12);color:#ff8fab;border:1px solid rgba(229,49,112,.2);animation:shakeX .5s}
.scoreboards{display:flex;gap:12px;width:100%;flex-wrap:wrap;justify-content:center}
.sb{flex:1 1 110px;min-width:110px;max-width:170px;background:var(--card);border:1px solid var(--card-border);border-radius:14px;padding:14px;text-align:center;transition:all .3s;backdrop-filter:blur(8px)}
.sb-name{font-size:.85rem;color:var(--text2);margin-bottom:6px}
.sb-score{font-size:1.8rem;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sb-lv{font-size:.75rem;color:var(--accent);margin-top:4px;font-weight:700}
.progress-bar{width:100%;height:8px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden;position:relative}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:4px;transition:width .5s cubic-bezier(.22,1,.36,1);position:relative}
.progress-fill::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);animation:shimmer 2s infinite}
.progress-text{font-size:.8rem;color:var(--text2);text-align:center;margin-top:6px}
.winner{font-size:1.5rem;font-weight:900;text-align:center;margin:10px 0;background:linear-gradient(135deg,#f9c74f,#f9844a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:float 2s ease-in-out infinite;filter:drop-shadow(0 0 15px rgba(249,199,79,.4))}
.final-scores{display:flex;gap:14px;width:100%;margin:14px 0;flex-wrap:wrap;justify-content:center}
.final-sb{flex:1 1 130px;min-width:130px;max-width:190px;background:var(--card);border:1px solid var(--card-border);border-radius:16px;padding:20px;text-align:center;transition:all .3s;backdrop-filter:blur(8px)}
.final-sb:hover{transform:translateY(-4px);box-shadow:0 8px 25px rgba(0,0,0,.3)}
.final-sb.winner-box{border-color:var(--warn);background:rgba(249,199,79,.06);box-shadow:0 0 25px rgba(249,199,79,.15)}
.fs-rank{font-size:.85rem;color:var(--accent);font-weight:700;margin-bottom:4px}
.fs-name{font-size:.9rem;color:var(--text2)}
.fs-score{font-size:2.2rem;font-weight:900;margin-top:6px}
.detail{font-size:.85rem;color:var(--text2);text-align:center;line-height:1.8}
.actions{display:flex;gap:12px;width:100%;margin-top:8px}
.actions .btn{flex:1}
@media(max-width:480px){
  h1{font-size:1.7rem}.q-text{font-size:1.5rem}
  .card{padding:22px}
  .btn{padding:13px 24px;font-size:.95rem}
}
</style>
</head>
<body>
<!-- ===== 视觉效果层 ===== -->
<div class="bg-orbs"><div class="orb"></div><div class="orb"></div><div class="orb"></div><div class="orb"></div></div>
<div class="bg-grid"></div>
<div class="particles" id="particles"></div>
<button class="sound-btn" id="soundToggle" onclick="toggleSound()">🔇</button>
<div class="brand">Made by AntonDing</div>

<!-- ===== 视图：主菜单 ===== -->
<div class="screen active" id="menuScreen">
  <h1>🧮 Math PK Arena</h1>
  <p class="subtitle">From elementary to high school · Adaptive difficulty · Solo Practice</p>
  <div class="card" style="display:flex;flex-direction:column;gap:12px">
    <button class="btn btn-primary" onclick="startSolo()">🎯 Solo Practice</button>
  </div>
</div>

<!-- ===== 视图：游戏 ===== -->
<div class="screen" id="gameScreen">
  <div class="scoreboards" id="scoreboards"></div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-text" id="progressText"></div>
  <div class="card q-card">
    <div class="tags" id="tags"></div>
    <div class="q-text" id="qText"></div>
    <input type="text" id="answerInput" placeholder="Your answer…" autocomplete="off" inputmode="decimal">
    <div class="fb" id="feedback"></div>
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn btn-primary" id="submitBtn" onclick="submitAnswer()">Submit</button>
      <button class="btn btn-secondary" id="nextBtn" onclick="nextQuestion()" style="display:none">Next →</button>
    </div>
  </div>
  <div style="font-size:.75rem;color:var(--text2);text-align:center" id="modeTag"></div>
</div>

<!-- ===== 视图：结算 ===== -->
<div class="screen" id="resultScreen">
  <div class="card" id="resultCard" style="display:flex;flex-direction:column;gap:10px"></div>
</div>

<script>
/* ========== 音频引擎 ========== */
let audioCtx=null, soundOn=false, masterGain=null;
function ensureAudio(){
  if(!audioCtx){
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    masterGain=audioCtx.createGain();
    masterGain.gain.setValueAtTime(0.5,audioCtx.currentTime);
    masterGain.connect(audioCtx.destination);
  }
}
function playTone(freq,dur,type='sine',vol=0.1,delay=0,attack=0.01,release=0.1){
  if(!soundOn)return;ensureAudio();
  const t=audioCtx.currentTime+delay;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0.001,t);
  g.gain.linearRampToValueAtTime(vol,t+attack);
  g.gain.setValueAtTime(vol,t+dur-release);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(masterGain||audioCtx.destination);
  o.start(t);o.stop(t+dur+0.01);
  return{o,g};
}
function playNoise(dur,vol=0.05){
  if(!soundOn)return;ensureAudio();
  const bufferSize=audioCtx.sampleRate*dur;
  const buffer=audioCtx.createBuffer(1,bufferSize,audioCtx.sampleRate);
  const data=buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++) data[i]=Math.random()*2-1;
  const source=audioCtx.createBufferSource();
  source.buffer=buffer;
  const g=audioCtx.createGain();
  const t=audioCtx.currentTime;
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  source.connect(g);g.connect(masterGain||audioCtx.destination);
  source.start(t);source.stop(t+dur);
}
let bgmTimer=null,bgmPlaying=false,bgmIdx=0;
const bgmChords=[
  {root:261.6,third:329.6,fifth:392.0,seventh:493.9,name:'Cmaj7'},
  {root:220.0,third:261.6,fifth:329.6,seventh:392.0,name:'Am7'},
  {root:174.6,third:220.0,fifth:261.6,seventh:329.6,name:'Fmaj7'},
  {root:196.0,third:246.9,fifth:293.7,seventh:349.2,name:'G7'},
  {root:261.6,third:311.1,fifth:392.0,seventh:466.2,name:'Cm7'},
  {root:329.6,third:392.0,fifth:493.9,seventh:523.3,name:'Em7b5'},
  {root:174.6,third:220.0,fifth:261.6,seventh:329.6,name:'Fmaj7'},
  {root:196.0,third:246.9,fifth:293.7,seventh:392.0,name:'G7'},
];
const bgmNoteDur=0.18, bgmInterval=220;
function startBGM(){
  if(bgmPlaying)return;bgmPlaying=true;bgmIdx=0;tickBGM();
}
function tickBGM(){
  if(!bgmPlaying)return;
  const chordIdx=Math.floor(bgmIdx/4)%bgmChords.length;
  const chord=bgmChords[chordIdx];
  const noteInChord=bgmIdx%4;
  const noteFreqs=[chord.root*2,chord.third*2,chord.fifth*2,chord.seventh*2];
  playTone(noteFreqs[noteInChord],bgmNoteDur,'triangle',0.018,0,0.005,0.05);
  if(noteInChord===0){
    playTone(chord.root/2,0.35,'sine',0.04,0,0.02,0.1);
  }
  if(noteInChord===0 && bgmIdx>4){
    playTone(chord.root,0.8,'sine',0.008,0,0.05,0.3);
    playTone(chord.fifth,0.8,'sine',0.005,0,0.05,0.3);
  }
  bgmIdx++;
  bgmTimer=setTimeout(tickBGM,bgmInterval);
}
function stopBGM(){bgmPlaying=false;clearTimeout(bgmTimer)}
function toggleSound(){
  soundOn=!soundOn;
  $('soundToggle').textContent=soundOn?'🔊':'🔇';
  if(soundOn){
    ensureAudio();
    if(audioCtx.state==='suspended')audioCtx.resume();
    startBGM();
    playTone(880,.1,'sine',.05);
  }else{
    stopBGM();
    playTone(440,.15,'sine',.03);
  }
}
function sfxCorrect(){
  playTone(523,.08,'sine',.08,0,0.005,0.02);
  playTone(659,.08,'sine',.06,.06,0.005,0.02);
  playTone(784,.12,'sine',.08,.12,0.005,0.03);
  playTone(1047,.2,'triangle',.05,.2,0.005,0.05);
  playTone(1319,.15,'sine',.03,.3,0.005,0.04);
  playNoise(0.05,0.03);
}
function sfxWrong(){
  playTone(349,.15,'sawtooth',.05,0,0.005,0.05);
  playTone(277,.2,'sawtooth',.04,.1,0.005,0.05);
  playTone(220,.3,'sawtooth',.03,.2,0.005,0.08);
  playTone(165,.25,'square',.02,.15,0.005,0.06);
  playNoise(0.08,0.02);
}
function sfxClick(){
  playTone(1000,.03,'sine',.03,0,0.002,0.01);
  playTone(1500,.02,'sine',.02,.01,0.002,0.008);
}
function sfxLevelUp(){
  const notes=[523,659,784,1047,1319,1568];
  notes.forEach((f,i)=>{
    playTone(f,.1,'triangle',.06,i*.06,0.005,0.03);
    if(i>2) playTone(f*2,.08,'sine',.02,i*.06,0.005,0.02);
  });
  playNoise(0.1,0.02);
}
function sfxLevelDown(){
  [392,330,262,220].forEach((f,i)=>{
    playTone(f,.12,'sawtooth',.04,i*.08,0.005,0.04);
  });
}
function sfxScreenTransition(){
  ensureAudio();
  const t=audioCtx.currentTime;
  const o=audioCtx.createOscillator();
  const g=audioCtx.createGain();
  o.type='sine';
  o.frequency.setValueAtTime(200,t);
  o.frequency.exponentialRampToValueAtTime(800,t+0.15);
  g.gain.setValueAtTime(0.03,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.2);
  o.connect(g);g.connect(masterGain||audioCtx.destination);
  o.start(t);o.stop(t+0.25);
}
function sfxVictory(){
  const melody=[523,659,784,1047,784,1047,1319,1568];
  melody.forEach((f,i)=>{
    playTone(f,.15,'triangle',.06,i*.1,0.005,0.03);
    playTone(f*1.5,.12,'sine',.02,i*.1,0.005,0.02);
  });
  setTimeout(()=>{
    playTone(261.6,.5,'sine',.03,0,0.05,0.2);
    playTone(329.6,.5,'sine',.02,0,0.05,0.2);
    playTone(392.0,.5,'sine',.015,0,0.05,0.2);
  },800);
}
function sfxDefeat(){
  const melody=[392,349,329,294,262,247,220];
  melody.forEach((f,i)=>{
    playTone(f,.2,'sawtooth',.03,i*.15,0.005,0.05);
  });
}
/* ========== Helpers ========== */
const $=id=>document.getElementById(id);
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=arr=>arr[rand(0,arr.length-1)];
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const fmt=n=>Number.isInteger(n)?n.toString():parseFloat(n.toFixed(4)).toString();
function parseInput(s){
  s=s.trim();
  if(s.includes('/')){const p=s.split('/');if(p.length===2){const a=parseFloat(p[0]),b=parseFloat(p[1]);if(b!==0)return a/b}}
  return parseFloat(s);
}
/* ========== Word Problems (English) ========== */
const wordProblems = [
  {gen: lv => {const a=rand(2,5+lv*3),b=rand(2,5+lv*2);return{text:`A pencil costs $${a}. How much do ${b} pencils cost?`,answer:a*b};}},
  {gen: lv => {const total=rand(10,20+lv*5),given=rand(3,total-2);return{text:`Tom had $${total}. He gave $${given} to his friend. How much does Tom have left?`,answer:total-given};}},
  {gen: lv => {const n=rand(2,6+lv),ans=rand(2,8+lv),total=n*ans;return{text:`${total} candies are shared equally among ${n} children. How many does each child get?`,answer:ans};}},
  {gen: lv => {const a=rand(5,15+lv*3),b=rand(3,10+lv*2);return{text:`Sarah has ${a} stickers. Her friend gives her ${b} more. How many stickers does Sarah have now?`,answer:a+b};}},
  {gen: lv => {const l=rand(3,8+lv),w=rand(2,6+lv);return{text:`A rectangle is ${l} cm long and ${w} cm wide. What is its area in cm²?`,answer:l*w};}},
  {gen: lv => {const total=rand(4,12+lv*3),part=rand(1,total-1);return{text:`In a class of ${total} students, ${part} are boys. What fraction of the class are boys? (Enter as decimal)`,answer:parseFloat((part/total).toFixed(4))};}},
  {gen: lv => {const dist=rand(4,12+lv*3),time=rand(1,4+lv);return{text:`A car travels ${dist} km in ${time} hour(s). What is its average speed in km/h?`,answer:parseFloat((dist/time).toFixed(4))};}},
  {gen: lv => {const a=rand(5,15+lv*2),b=rand(2,a-1);return{text:`Alice is ${a} years old. Bob is ${b} years younger than Alice. How old is Bob?`,answer:a-b};}},
  {gen: lv => {const boxes=rand(3,8+lv),items=rand(2,6+lv);return{text:`Each box contains ${items} toys. There are ${boxes} boxes. How many toys are there in total?`,answer:boxes*items};}},
  {gen: lv => {const total=rand(10,30+lv*5),perDay=rand(2,8+lv);return{text:`A book has ${total} pages. Lily reads ${perDay} pages per day. How many days does she need to finish it?`,answer:parseFloat((total/perDay).toFixed(4))};}},
  {gen: lv => {const num=rand(20,100),pct=rand(10,50);return{text:`What is ${pct}% of ${num}?`,answer:num*pct/100};}},
  {gen: lv => {const a=rand(2,10),b=rand(2,10);return{text:`The ratio of apples to oranges is ${a}:${b}. If there are ${a*5} apples, how many oranges are there?`,answer:b*5};}},
  {gen: lv => {const p=rand(100,500),r=rand(3,8),y=rand(1,4);return{text:`Simple interest: principal $${p}, rate ${r}% per year, ${y} years. Find the interest.`,answer:p*r/100*y};}},
  {gen: lv => {const side=rand(3,9);return{text:`A square has side length ${side}. Find its perimeter.`,answer:side*4};}},
  {gen: lv => {const n1=rand(1,6),n2=rand(1,6);return{text:`Two fair dice are rolled. Probability the first shows ${n1} and the second shows ${n2}? (decimal)`,answer:parseFloat((1/36).toFixed(4))};}},
  {gen: lv => {const meters=rand(1,5);return{text:`Convert ${meters} meter(s) to centimeters.`,answer:meters*100};}},
  {gen: lv => {const hrs=rand(2,5),km=rand(3,9);return{text:`A train travels ${km} km per hour. How far does it go in ${hrs} hours?`,answer:km*hrs};}},
];
function genWordProblem(lv) {
  const pool = wordProblems.filter((_, i) => {
    if (lv <= 3) return i < 6;
    if (lv <= 6) return i < 11;
    return true;
  });
  const wp = pick(pool);
  return { ...wp.gen(lv), type: 'Word Problem', lv };
}
/* ========== Question Generator (Lv1-10, English) ========== */
function genQuestion(lv){
  lv=clamp(lv,1,10);
  const roll=Math.random();
  if(roll<0.22) return genWordProblem(lv);

  if(lv<=2){
    const op=pick(['+','−','×']);
    let a,b,ans,text;
    if(op==='+'){a=rand(1,10*lv);b=rand(1,10*lv);ans=a+b;text=`Calculate ${a} + ${b}`}
    else if(op==='−'){a=rand(2,12*lv);b=rand(1,a);ans=a-b;text=`Calculate ${a} − ${b}`}
    else{a=rand(2,5*lv);b=rand(2,5*lv);ans=a*b;text=`Calculate ${a} × ${b}`}
    return{text,answer:ans,type:'Arithmetic',lv};
  }
  if(lv<=4){
    const variant=rand(0,5);
    if(variant===0){
      const a=rand(2,8),b=rand(2,8),c=rand(1,10),ans=a*b+c;
      return{text:`Calculate ${a} × ${b} + ${c}`,answer:ans,type:'Arithmetic',lv};
    }else if(variant===1){
      const b=rand(2,9),ans=rand(2,12),a=b*ans;
      return{text:`Calculate ${a} ÷ ${b}`,answer:ans,type:'Arithmetic',lv};
    }else if(variant===2){
      const num=rand(1,8),den=rand(num+1,12);
      return{text:`Convert ${num}/${den} to a decimal (4 decimal places)`,answer:parseFloat((num/den).toFixed(4)),type:'Fraction',lv};
    }else if(variant===3){
      const v=rand(10,90);
      return{text:`Convert ${v}% to a decimal`,answer:v/100,type:'Percent',lv};
    }else if(variant===4){
      const a=rand(10,30),b=rand(10,30),c=rand(1,15),ans=a+b-c;
      return{text:`Calculate ${a} + ${b} − ${c}`,answer:ans,type:'Arithmetic',lv};
    }else{
      const d=rand(1,9),f=rand(2,5);
      return{text:`Convert ${d}.${f} to a fraction in simplest form (numerator)`,answer:d*10+f===10*f?'invalid':(d*10+f)/Math.pow(10,1),type:'Fraction',lv};
    }
  }
  if(lv<=6){
    const variant=rand(0,6);
    if(variant===0){
      const a=rand(2,9),b=rand(2,9),c=rand(2,9),d=rand(2,9),ans=a+b*c-d;
      return{text:`Calculate ${a} + ${b} × ${c} − ${d}`,answer:ans,type:'Arithmetic',lv};
    }else if(variant===1){
      const x=rand(-10,10),a=rand(2,8),b=rand(-20,20),c=a*x+b;
      return{text:`Solve for x: ${a}x + ${b} = ${c}`,answer:x,type:'Algebra',lv};
    }else if(variant===2){
      const n1=rand(1,6),d1=rand(2,8),n2=rand(1,6),d2=rand(2,8),ans=n1/d1+n2/d2;
      return{text:`Compute ${n1}/${d1} + ${n2}/${d2} (decimal)`,answer:parseFloat(ans.toFixed(4)),type:'Fraction',lv};
    }else if(variant===3){
      const p1=rand(1,5),p2=rand(1,5);
      return{text:`Simplify the ratio ${p1*2}:${p2*2}. Give the first number.`,answer:p1,type:'Ratio',lv};
    }else if(variant===4){
      const base=rand(3,10),h=rand(3,10);
      return{text:`A triangle has base ${base} and height ${h}. Find its area.`,answer:base*h/2,type:'Geometry',lv};
    }else if(variant===5){
      const v=rand(20,80);
      return{text:`What is ${v}% of ${100}?`,answer:v,type:'Percent',lv};
    }else{
      const n=rand(2,6),m=rand(2,5);
      return{text:`Find the LCM of ${n} and ${m}.`,answer:lcm(n,m),type:'Arithmetic',lv};
    }
  }
  if(lv<=8){
    const variant=rand(0,7);
    if(variant===0){
      const p=rand(-9,9),q=rand(-9,9);
      return{text:`x² − ${p+q}x + ${p*q} = 0. What is the sum of the roots?`,answer:p+q,type:'Algebra',lv};
    }else if(variant===1){
      const n=rand(2,12);
      return{text:`Evaluate √${n*n} + √${(n+1)*(n+1)}`,answer:n+(n+1),type:'Arithmetic',lv};
    }else if(variant===2){
      const a1=rand(1,10),d=rand(2,6),n=rand(5,12),an=a1+(n-1)*d;
      return{text:`Arithmetic sequence: a₁=${a1}, common difference d=${d}. Find a_${n}.`,answer:an,type:'Algebra',lv};
    }else if(variant===3){
      const x1=rand(-5,5),y1=rand(-5,5),x2=rand(x1+1,x1+6),y2=rand(-5,5),slope=(y2-y1)/(x2-x1);
      return{text:`Find the slope between (${x1},${y1}) and (${x2},${y2}).`,answer:parseFloat(slope.toFixed(4)),type:'Algebra',lv};
    }else if(variant===4){
      const total=rand(4,10),good=rand(1,total-1),prob=good/total;
      return{text:`A bag has ${total} marbles, ${good} red. Draw one. P(red)? (decimal)`,answer:parseFloat(prob.toFixed(4)),type:'Probability',lv};
    }else if(variant===5){
      const b=rand(2,4),e=rand(2,4);
      return{text:`Calculate ${b}^${e}.`,answer:Math.pow(b,e),type:'Arithmetic',lv};
    }else if(variant===6){
      const n=rand(2,10);
      return{text:`Simplify √(${n*n*2})? Divide by √2 to get the result.`,answer:n,type:'Algebra',lv};
    }else{
      const a=rand(1,5),b=rand(1,5);
      return{text:`The product of two numbers is ${a*b}. Their sum is ${a+b}. Find the larger number.`,answer:Math.max(a,b),type:'Algebra',lv};
    }
  }
  const variant=rand(0,7);
  if(variant===0){
    const angles=[
      {deg:0,sin:0,cos:1},{deg:30,sin:0.5,cos:0.866},
      {deg:45,sin:0.7071,cos:0.7071},{deg:60,sin:0.866,cos:0.5},
      {deg:90,sin:1,cos:0},{deg:180,sin:0,cos:-1},
      {deg:270,sin:-1,cos:0},{deg:360,sin:0,cos:1}
    ];
    const a=pick(angles);
    const fn=Math.random()>.5?'sin':'cos';
    const ans=fn==='sin'?a.sin:a.cos;
    return{text:`${fn}(${a.deg}°) = ? (round to 4 decimals)`,answer:ans,type:'Trigonometry',lv};
  }else if(variant===1){
    const bases=[2,3,5,10];
    const base=pick(bases),exp=rand(1,5),val=Math.pow(base,exp);
    return{text:`log_${base}(${val}) = ?`,answer:exp,type:'Logarithm',lv};
  }else if(variant===2){
    const a=rand(1,6),n=rand(2,4),k=rand(1,4),deriv=a*n*Math.pow(k,n-1);
    return{text:`f(x) = ${a}x^${n}. Compute f'(${k}).`,answer:deriv,type:'Calculus',lv};
  }else if(variant===3){
    const n=rand(4,8),r=rand(2,Math.min(n-1,4));
    const fact=x=>{let v=1;for(let i=2;i<=x;i++)v*=i;return v};
    return{text:`Compute the combination C(${n}, ${r}).`,answer:fact(n)/(fact(r)*fact(n-r)),type:'Combinatorics',lv};
  }else if(variant===4){
    const a=rand(1,4),r=2,n=rand(3,5),sum=a*(Math.pow(r,n)-1)/(r-1);
    return{text:`Geometric series: a=${a}, r=${r}, n=${n}. Find the sum.`,answer:sum,type:'Sequences',lv};
  }else if(variant===5){
    const m=rand(1,4),n=rand(1,4);
    return{text:`Expand (x+${m})(x+${n}). Give the coefficient of x.`,answer:m+n,type:'Algebra',lv};
  }else if(variant===6){
    const k=rand(2,4);
    return{text:`How many permutations of ${k} distinct objects are there?`,answer:factOf(k),type:'Combinatorics',lv};
  }else{
    const x=rand(-8,8),a=rand(2,6),b=rand(-10,10),c=Math.abs(a*x+b),x2=(-c-b)/a;
    return{text:`|${a}x + ${b}| = ${c}. Give the larger solution.`,answer:Math.max(x,x2),type:'Algebra',lv};
  }
}
function factOf(x){let v=1;for(let i=2;i<=x;i++)v*=i;return v}
function lcm(a,b){let x=a,y=b;while(y){[x,y]=[y,x%y]}return a*b/x}

/* ========== State ========== */
let players=[],qCount=0;
const TOTAL_Q=20;
let currentQ=null,answered=false;

/* ========== Screens ========== */
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $(id).classList.add('active');
  if(soundOn) sfxScreenTransition();
}
function goMenu(){stopBGM();show('menuScreen')}

/* ========== Solo ========== */
function startSolo(){
  sfxClick();
  players=[{name:'You',score:0,lv:1,correct:0,wrong:0,_lastCorrect:true}];
  qCount=0;
  show('gameScreen');
  $('modeTag').textContent='Solo Mode · Adaptive Difficulty';
  renderScoreboards();
  nextQuestion();
  startBGM();
}

/* ========== Game Logic ========== */
function renderScoreboards(){
  const sb=$('scoreboards');sb.innerHTML='';
  players.forEach((p)=>{
    const d=document.createElement('div');
    d.className='sb';
    d.innerHTML=`<div class="sb-name">${p.name}</div><div class="sb-score">${p.score}</div><div class="sb-lv">Lv ${p.lv}</div>`;
    sb.appendChild(d);
  });
  $('progressFill').style.width=(qCount/TOTAL_Q*100)+'%';
  $('progressText').textContent=`Question ${qCount} / ${TOTAL_Q}`;
}
function nextQuestion(){
  answered=false;
  $('submitBtn').style.display='';$('nextBtn').style.display='none';
  $('feedback').className='fb';
  $('answerInput').value='';$('answerInput').disabled=false;$('answerInput').focus();
  const p=players[0];
  if(qCount>0){
    const prev=p._lastCorrect;
    const oldLv=p.lv;
    if(prev)p.lv=Math.min(p.lv+1,10);
    else p.lv=Math.max(p.lv-1,1);
    if(p.lv>oldLv)sfxLevelUp();
    else if(p.lv<oldLv)sfxLevelDown();
  }
  currentQ=genQuestion(p.lv);
  $('qText').textContent=currentQ.text;
  const tags=$('tags');tags.innerHTML='';
  const typeClass=currentQ.type==='Arithmetic'?'tag-arithmetic':currentQ.type==='Algebra'?'tag-algebra':
    currentQ.type==='Fraction'?'tag-frac':currentQ.type==='Percent'?'tag-percent':
    currentQ.type==='Geometry'?'tag-geo':currentQ.type==='Probability'?'tag-prob':'tag-word';
  tags.innerHTML=`<span class="tag ${typeClass}">${currentQ.type}</span><span class="tag tag-diff">Lv ${p.lv}</span>`;
  renderScoreboards();
}
function submitAnswer(){
  if(answered)return;
  const raw=$('answerInput').value;
  const val=parseInput(raw);
  if(isNaN(val)){$('answerInput').focus();return}
  answered=true;
  $('answerInput').disabled=true;
  $('submitBtn').style.display='none';$('nextBtn').style.display='';
  const p=players[0];
  const correct=Math.abs(val-currentQ.answer)<0.01;
  const fb=$('feedback');
  if(correct){
    p.score+=10*p.lv;p.correct++;p._lastCorrect=true;
    const nextLv=Math.min(p.lv+1,10);
    fb.className='fb show correct';
    fb.innerHTML=`Correct! &nbsp; Lv ${p.lv} → ${nextLv} &nbsp; (+${10*p.lv})`;
    sfxCorrect();
  }else{
    p.wrong++;p._lastCorrect=false;
    const nextLv=Math.max(p.lv-1,1);
    fb.className='fb show wrong';
    fb.innerHTML=`Wrong! &nbsp; Answer: ${fmt(currentQ.answer)}<br>Lv ${p.lv} → ${nextLv}`;
    sfxWrong();
  }
  qCount++;
  renderScoreboards();
  if(qCount>=TOTAL_Q){
    setTimeout(showResult,1400);
    return;
  }
}
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&$('gameScreen').classList.contains('active')){
    if(!answered)submitAnswer();
    else if($('nextBtn').style.display!=='none')nextQuestion();
  }
});

/* ========== Result ========== */
function showResult(){
  stopBGM();show('resultScreen');
  const rc=$('resultCard');
  let html='<h2>🏁 Game Over</h2>';
  const p=players[0];
  const acc=p.correct+p.wrong?Math.round(p.correct/(p.correct+p.wrong)*100):0;
  html+=`<div class="winner">Great job, ${p.name}!</div>`;
  html+=`<div class="final-scores"><div class="final-sb winner-box"><div class="fs-rank">#1</div><div class="fs-name">${p.name}</div><div class="fs-score">${p.score}</div></div></div>`;
  html+=`<div class="detail">✅ ${p.correct} &nbsp; ❌ ${p.wrong} &nbsp; Accuracy: ${acc}%<br>Final Level: ${p.lv}</div>`;
  if(p.score > TOTAL_Q*5) sfxVictory();
  else sfxDefeat();
  html+=`<div class="actions"><button class="btn btn-primary" onclick="goMenu()">Back to Menu</button><button class="btn btn-secondary" onclick="startSolo()">Play Again</button></div>`;
  rc.innerHTML=html;
}

/* ========== 粒子背景 ========== */
(function(){
  const container=document.getElementById('particles');
  if(!container)return;
  for(let i=0;i<30;i++){
    const p=document.createElement('div');
    p.className='particle';
    p.style.left=Math.random()*100+'%';
    p.style.animationDuration=(Math.random()*15+10)+'s';
    p.style.animationDelay=(Math.random()*15)+'s';
    p.style.width=p.style.height=(Math.random()*3+1)+'px';
    container.appendChild(p);
  }
})();
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Math PK Arena</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f0c29;--bg2:#302b63;--bg3:#24243e;
  --card:rgba(255,255,255,.07);--card-border:rgba(255,255,255,.12);
  --accent:#7f5af0;--accent2:#2cb67d;--danger:#e53170;--warn:#f9c74f;
  --text:#fffffe;--text2:#94a1b2;
  --radius:16px;--shadow:0 8px 32px rgba(0,0,0,.35);
}
body{
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:linear-gradient(135deg,var(--bg),var(--bg2),var(--bg3));
  color:var(--text);min-height:100vh;overflow-x:hidden;
  display:flex;justify-content:center;align-items:center;
}
.screen{display:none;width:100%;max-width:520px;padding:20px;animation:fadeIn .4s ease}
.screen.active{display:flex;flex-direction:column;align-items:center;gap:18px}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes shakeX{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

h1{font-size:2rem;background:linear-gradient(90deg,#7f5af0,#2cb67d);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center;line-height:1.3}
h2{font-size:1.4rem;text-align:center}
.subtitle{color:var(--text2);font-size:.92rem;text-align:center;margin-top:-8px}

.card{
  background:var(--card);border:1px solid var(--card-border);
  border-radius:var(--radius);padding:24px;width:100%;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:var(--shadow);
}

.btn{
  border:none;border-radius:12px;padding:14px 28px;font-size:1rem;font-weight:700;
  cursor:pointer;transition:all .2s;width:100%;letter-spacing:.3px;
}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{filter:brightness(1.15);transform:translateY(-2px)}
.btn-secondary{background:rgba(255,255,255,.1);color:var(--text);border:1px solid var(--card-border)}
.btn-secondary:hover{background:rgba(255,255,255,.18)}
.btn-danger{background:var(--danger);color:#fff}
.btn:active{transform:scale(.97)}

input[type=text],input[type=number]{
  width:100%;padding:14px 16px;border-radius:12px;border:1px solid var(--card-border);
  background:rgba(255,255,255,.06);color:#fff;font-size:1.1rem;outline:none;
  transition:border .2s;text-align:center;
}
input:focus{border-color:var(--accent)}

/* Sound toggle */
.sound-btn{
  position:fixed;top:16px;right:16px;z-index:99;
  width:44px;height:44px;border-radius:50%;border:1px solid var(--card-border);
  background:var(--card);backdrop-filter:blur(8px);cursor:pointer;
  font-size:1.3rem;display:flex;align-items:center;justify-content:center;
  transition:all .2s;
}
.sound-btn:hover{background:rgba(255,255,255,.15)}

/* Brand */
.brand{position:fixed;top:16px;left:20px;z-index:99;font-size:.85rem;font-weight:700;color:rgba(255,255,255,.5);letter-spacing:.5px;user-select:none}

/* Room slots */
.slots{display:flex;gap:12px;width:100%}
.slot{
  flex:1;background:rgba(255,255,255,.04);border:1px dashed var(--card-border);
  border-radius:12px;padding:16px;text-align:center;transition:all .3s;
}
.slot.joined{border-style:solid;border-color:var(--accent2);background:rgba(44,182,125,.08)}
.slot .avatar{font-size:2rem;margin-bottom:6px}
.slot .sname{font-weight:700;font-size:.95rem}
.slot .status{font-size:.78rem;color:var(--text2);margin-top:4px}

.room-code-display{
  font-size:2.2rem;font-weight:900;letter-spacing:6px;text-align:center;
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  margin:8px 0;user-select:all;cursor:pointer;
}

/* Game area */
.q-card{text-align:center;padding:32px 24px}
.q-text{font-size:1.8rem;font-weight:800;line-height:1.4;margin:12px 0 20px;word-break:break-word}
.tags{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:8px}
.tag{padding:4px 12px;border-radius:20px;font-size:.75rem;font-weight:700;letter-spacing:.5px}
.tag-arithmetic{background:rgba(127,90,240,.25);color:#b4a0ff}
.tag-algebra{background:rgba(44,182,125,.25);color:#6ee7b7}
.tag-word{background:rgba(249,199,79,.2);color:#f9c74f}
.tag-diff{background:rgba(255,255,255,.1);color:var(--text2)}

.fb{
  margin-top:12px;padding:12px 16px;border-radius:12px;font-weight:700;
  text-align:center;font-size:.95rem;opacity:0;transition:all .3s;
}
.fb.show{opacity:1}
.fb.correct{background:rgba(44,182,125,.18);color:#6ee7b7;border:1px solid rgba(44,182,125,.3)}
.fb.wrong{background:rgba(229,49,112,.15);color:#ff8fab;border:1px solid rgba(229,49,112,.25);animation:shakeX .4s}

/* Scoreboards */
.scoreboards{display:flex;gap:10px;width:100%}
.sb{
  flex:1;background:var(--card);border:1px solid var(--card-border);
  border-radius:12px;padding:12px;text-align:center;transition:all .3s;
}
.sb.active-turn{border-color:var(--accent);box-shadow:0 0 16px rgba(127,90,240,.3);animation:pulse 1.5s infinite}
.sb-name{font-size:.8rem;color:var(--text2);margin-bottom:4px}
.sb-score{font-size:1.6rem;font-weight:900}
.sb-lv{font-size:.7rem;color:var(--accent);margin-top:2px}

.progress-bar{width:100%;height:6px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:3px;transition:width .4s}
.progress-text{font-size:.78rem;color:var(--text2);text-align:center}
.turn-label{font-size:.85rem;color:var(--accent);font-weight:700;text-align:center;min-height:1.2em}

/* Result */
.winner{font-size:1.3rem;font-weight:800;text-align:center;margin:8px 0;
  background:linear-gradient(90deg,#f9c74f,#f9844a);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.final-scores{display:flex;gap:12px;width:100%;margin:12px 0}
.final-sb{flex:1;background:var(--card);border:1px solid var(--card-border);border-radius:12px;padding:18px;text-align:center}
.final-sb.winner-box{border-color:var(--warn);background:rgba(249,199,79,.08)}
.fs-name{font-size:.85rem;color:var(--text2)}
.fs-score{font-size:2rem;font-weight:900;margin-top:4px}
.detail{font-size:.82rem;color:var(--text2);text-align:center;line-height:1.7}

.actions{display:flex;gap:10px;width:100%}
.actions .btn{flex:1}

@media(max-width:400px){
  h1{font-size:1.6rem}.q-text{font-size:1.4rem}.room-code-display{font-size:1.8rem}
}
</style>
</head>
<body>

<button class="sound-btn" id="soundToggle" onclick="toggleSound()">🔇</button>
<div class="brand">Made by AntonDing</div>

<!-- MENU -->
<div class="screen active" id="menuScreen">
  <h1>🧮 Math PK Arena</h1>
  <p class="subtitle">从小学到高中 · 自适应难度 · 双人对战</p>
  <div class="card" style="display:flex;flex-direction:column;gap:12px">
    <button class="btn btn-primary" onclick="startSolo()">🎯 Solo Practice</button>
    <button class="btn btn-secondary" onclick="showRoomScreen()">⚔️ 2-Player PK</button>
  </div>
</div>

<!-- ROOM -->
<div class="screen" id="roomScreen">
  <h2>⚔️ Battle Room</h2>
  <p class="subtitle">创建或加入房间，与好友实时PK</p>

  <div class="card" id="createSection">
    <label style="font-size:.85rem;color:var(--text2);margin-bottom:6px;display:block">Your Name</label>
    <input type="text" id="p1Input" placeholder="Player 1" maxlength="10">
    <button class="btn btn-primary" style="margin-top:12px" onclick="createRoom()">Create Room</button>
  </div>

  <div class="card" id="roomCodeBox" style="display:none;text-align:center">
    <div style="font-size:.85rem;color:var(--text2)">Room Code</div>
    <div class="room-code-display" id="roomCode" title="Click to copy"></div>
    <div class="slots">
      <div class="slot joined"><div class="avatar">👤</div><div class="sname" id="p1Name">P1</div><div class="status">Ready</div></div>
      <div class="slot" id="slot2"><div class="avatar">⏳</div><div class="sname" id="p2Name">Waiting…</div><div class="status">—</div></div>
    </div>
  </div>

  <div class="card" id="joinSection" style="display:none">
    <label style="font-size:.85rem;color:var(--text2);margin-bottom:6px;display:block">Room Code</label>
    <input type="text" id="joinCode" placeholder="Enter code" maxlength="6" style="text-transform:uppercase;letter-spacing:4px">
    <label style="font-size:.85rem;color:var(--text2);margin-bottom:6px;display:block;margin-top:10px">Your Name</label>
    <input type="text" id="p2Input" placeholder="Player 2" maxlength="10">
    <button class="btn btn-primary" style="margin-top:12px" onclick="joinRoom()">Join Room</button>
  </div>

  <div id="startSection" style="display:none;width:100%">
    <button class="btn btn-primary" onclick="startDuel()">🚀 Start Battle!</button>
  </div>

  <button class="btn btn-secondary" onclick="goMenu()" style="margin-top:4px">← Back</button>
</div>

<!-- GAME -->
<div class="screen" id="gameScreen">
  <div class="turn-label" id="turnLabel"></div>
  <div class="scoreboards" id="scoreboards"></div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-text" id="progressText"></div>

  <div class="card q-card">
    <div class="tags" id="tags"></div>
    <div class="q-text" id="qText"></div>
    <input type="text" id="answerInput" placeholder="Your answer…" autocomplete="off" inputmode="decimal">
    <div class="fb" id="feedback"></div>
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn btn-primary" id="submitBtn" onclick="submitAnswer()">Submit</button>
      <button class="btn btn-secondary" id="nextBtn" onclick="nextQuestion()" style="display:none">Next →</button>
    </div>
  </div>
  <div style="font-size:.75rem;color:var(--text2);text-align:center" id="modeTag"></div>
</div>

<!-- RESULT -->
<div class="screen" id="resultScreen">
  <div class="card" id="resultCard" style="display:flex;flex-direction:column;gap:10px"></div>
</div>

<script>
/* ========== Audio Engine ========== */
let audioCtx=null, soundOn=false;
function ensureAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}

function playTone(freq,dur,type='sine',vol=0.1,delay=0){
  if(!soundOn)return;ensureAudio();
  const t=audioCtx.currentTime+delay;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(audioCtx.destination);
  o.start(t);o.stop(t+dur);
}

function sfxCorrect(){
  playTone(523,.1,'sine',.1,0);
  playTone(659,.1,'sine',.1,.08);
  playTone(784,.18,'sine',.12,.16);
  playTone(1047,.25,'triangle',.06,.24);
}
function sfxWrong(){
  playTone(233,.2,'sawtooth',.07,0);
  playTone(185,.3,'sawtooth',.06,.12);
}
function sfxClick(){playTone(1200,.04,'sine',.04)}
function sfxLevelUp(){
  [523,659,784,1047,1319].forEach((f,i)=>playTone(f,.12,'triangle',.07,i*.07));
}
function sfxLevelDown(){
  [392,330,262].forEach((f,i)=>playTone(f,.15,'sawtooth',.05,i*.1));
}

/* BGM – chord progression arpeggio */
let bgmTimer=null,bgmPlaying=false,bgmIdx=0;
// Cmaj7 → Am7 → Fmaj7 → G7  (each chord = 4 notes × 2 beats)
const bgmChords=[
  [261.6,329.6,392.0,493.9],  // Cmaj7
  [220.0,261.6,329.6,392.0],  // Am7
  [174.6,220.0,261.6,329.6],  // Fmaj7
  [196.0,246.9,293.7,349.2],  // G7
];
const bgmNoteDur=0.22, bgmInterval=260;

function startBGM(){
  if(bgmPlaying)return;bgmPlaying=true;bgmIdx=0;tickBGM();
}
function tickBGM(){
  if(!bgmPlaying)return;
  const chord=bgmChords[Math.floor(bgmIdx/4)%bgmChords.length];
  const note=chord[bgmIdx%4];
  playTone(note,bgmNoteDur,'triangle',0.025);
  bgmIdx++;
  bgmTimer=setTimeout(tickBGM,bgmInterval);
}
function stopBGM(){bgmPlaying=false;clearTimeout(bgmTimer)}

function toggleSound(){
  soundOn=!soundOn;
  $('soundToggle').textContent=soundOn?'🔊':'🔇';
  if(soundOn){ensureAudio();if(audioCtx.state==='suspended')audioCtx.resume();startBGM()}
  else stopBGM();
}

/* ========== Helpers ========== */
const $=id=>document.getElementById(id);
const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=arr=>arr[rand(0,arr.length-1)];
const clamp=(v,lo,hi)=>Math.max(lo,Math.min(hi,v));
const fmt=n=>Number.isInteger(n)?n.toString():parseFloat(n.toFixed(4)).toString();

function parseInput(s){
  s=s.trim();
  if(s.includes('/')){const p=s.split('/');if(p.length===2){const a=parseFloat(p[0]),b=parseFloat(p[1]);if(b!==0)return a/b}}
  return parseFloat(s);
}


/* ========== Word Problems (English) ========== */
const wordProblems = [
  { // shopping/money
    gen: lv => {
      const a = rand(2, 5 + lv * 3), b = rand(2, 5 + lv * 2);
      return { text: `A pencil costs $${a}. How much do ${b} pencils cost?`, answer: a * b };
    }
  },
  { // subtraction/story
    gen: lv => {
      const total = rand(10, 20 + lv * 5), given = rand(3, total - 2);
      return { text: `Tom had $${total}. He gave $${given} to his friend. How much does Tom have left?`, answer: total - given };
    }
  },
  { // division/equal share
    gen: lv => {
      const n = rand(2, 6 + lv), ans = rand(2, 8 + lv);
      const total = n * ans;
      return { text: `${total} candies are shared equally among ${n} children. How many does each child get?`, answer: ans };
    }
  },
  { // addition/story
    gen: lv => {
      const a = rand(5, 15 + lv * 3), b = rand(3, 10 + lv * 2);
      return { text: `Sarah has ${a} stickers. Her friend gives her ${b} more. How many stickers does Sarah have now?`, answer: a + b };
    }
  },
  { // area
    gen: lv => {
      const l = rand(3, 8 + lv), w = rand(2, 6 + lv);
      return { text: `A rectangle is ${l} cm long and ${w} cm wide. What is its area in cm²?`, answer: l * w };
    }
  },
  { // fraction of total
    gen: lv => {
      const total = rand(4, 12 + lv * 3), part = rand(1, total - 1);
      return { text: `In a class of ${total} students, ${part} are boys. What fraction of the class are boys? (Enter as decimal)`, answer: parseFloat((part / total).toFixed(4)) };
    }
  },
  { // speed/distance
    gen: lv => {
      const dist = rand(4, 12 + lv * 3), time = rand(1, 4 + lv);
      const ans = dist / time;
      return { text: `A car travels ${dist} km in ${time} hour(s). What is its average speed in km/h?`, answer: parseFloat(ans.toFixed(4)) };
    }
  },
  { // age difference
    gen: lv => {
      const a = rand(5, 15 + lv * 2), b = rand(2, a - 1);
      return { text: `Alice is ${a} years old. Bob is ${b} years younger than Alice. How old is Bob?`, answer: a - b };
    }
  },
  { // multiplication/story
    gen: lv => {
      const boxes = rand(3, 8 + lv), items = rand(2, 6 + lv);
      return { text: `Each box contains ${items} toys. There are ${boxes} boxes. How many toys are there in total?`, answer: boxes * items };
    }
  },
  { // work/rate
    gen: lv => {
      const total_pages = rand(10, 30 + lv * 5), per_day = rand(2, 8 + lv);
      const ans = total_pages / per_day;
      return { text: `A book has ${total_pages} pages. Lily reads ${per_day} pages per day. How many days does she need to finish it?`, answer: parseFloat(ans.toFixed(4)) };
    }
  },
];

function genWordProblem(lv) {
  const pool = wordProblems.filter((_, i) => {
    // Higher levels get more complex word problems
    if (lv <= 3) return i < 5;       // simple ones for low levels
    if (lv <= 6) return i < 8;        // add more for mid levels
    return true;                       // all available for high levels
  });
  const wp = pick(pool);
  return { ...wp.gen(lv), type: 'Word Problem', lv };
}


/* ========== Question Generator (Lv1–10, elementary→high school) ========== */
function genQuestion(lv){
  lv=clamp(lv,1,10);

  // ~20% chance of word problem at any level
  if(Math.random() < 0.20){
    return genWordProblem(lv);
  }

  // Lv1-2: Basic arithmetic
  if(lv<=2){
    const ops=['+','-','×'];
    const op=pick(ops);
    let a,b,ans,text;
    if(op==='+'){a=rand(1,10*lv);b=rand(1,10*lv);ans=a+b;text=`${a} + ${b} = ?`}
    else if(op==='-'){a=rand(2,12*lv);b=rand(1,a);ans=a-b;text=`${a} − ${b} = ?`}
    else{a=rand(2,5*lv);b=rand(2,5*lv);ans=a*b;text=`${a} × ${b} = ?`}
    return{text,answer:ans,type:'Arithmetic',lv};
  }

  // Lv3-4: Multi-step arithmetic & simple division
  if(lv<=4){
    const variant=rand(0,2);
    if(variant===0){
      const a=rand(2,8),b=rand(2,8),c=rand(1,10);
      const ans=a*b+c;return{text:`${a} × ${b} + ${c} = ?`,answer:ans,type:'Arithmetic',lv};
    }else if(variant===1){
      const b=rand(2,9),ans=rand(2,12),a=b*ans;
      return{text:`${a} ÷ ${b} = ?`,answer:ans,type:'Arithmetic',lv};
    }else{
      const a=rand(10,30),b=rand(10,30),c=rand(1,15);
      const ans=a+b-c;return{text:`${a} + ${b} − ${c} = ?`,answer:ans,type:'Arithmetic',lv};
    }
  }

  // Lv5-6: Negative numbers, order of operations, simple equations
  if(lv<=6){
    const variant=rand(0,2);
    if(variant===0){
      const a=rand(2,9),b=rand(2,9),c=rand(2,9),d=rand(2,9);
      const ans=a+b*c-d;return{text:`${a} + ${b} × ${c} − ${d} = ?`,answer:ans,type:'Arithmetic',lv};
    }else if(variant===1){
      // ax + b = c, solve x
      const x=rand(-10,10),a=rand(2,8),b=rand(-20,20);
      const c=a*x+b;
      return{text:`Solve: ${a}x + (${b}) = ${c}`,answer:x,type:'Algebra',lv};
    }else{
      const a=rand(3,12),b=rand(3,12);
      return{text:`(${a})² − (${b})² = ?`,answer:a*a-b*b,type:'Arithmetic',lv};
    }
  }

  // Lv7-8: Quadratic, sqrt, systems, sequences
  if(lv<=8){
    const variant=rand(0,3);
    if(variant===0){
      // Perfect square quadratic: (x-p)(x-q)=0, ask sum of roots
      const p=rand(-9,9),q=rand(-9,9);
      return{text:`x² − ${p+q}x + ${p*q} = 0\nSum of roots = ?`,answer:p+q,type:'Algebra',lv};
    }else if(variant===1){
      const n=rand(2,12);
      return{text:`√${n*n} + √${(n+1)*(n+1)} = ?`,answer:n+(n+1),type:'Arithmetic',lv};
    }else if(variant===2){
      // Arithmetic sequence: a_n = a1 + (n-1)d
      const a1=rand(1,10),d=rand(2,6),n=rand(5,12);
      const an=a1+(n-1)*d;
      return{text:`Arithmetic seq: a₁=${a1}, d=${d}\na_${n} = ?`,answer:an,type:'Algebra',lv};
    }else{
      // |ax+b| = c
      const x=rand(-8,8),a=rand(2,6),b=rand(-10,10);
      const c=Math.abs(a*x+b);
      // Two solutions possible, accept either
      const x2=(-c-b)/a;
      return{text:`|${a}x + ${b}| = ${c}\nLarger x = ?`,answer:Math.max(x,x2),type:'Algebra',lv};
    }
  }

  // Lv9-10: Trig, log, exponential, derivatives, combinatorics
  const variant=rand(0,4);
  if(variant===0){
    // sin/cos special angles
    const angles=[
      {deg:0,sin:0,cos:1},{deg:30,sin:0.5,cos:0.866},
      {deg:45,sin:0.7071,cos:0.7071},{deg:60,sin:0.866,cos:0.5},
      {deg:90,sin:1,cos:0},{deg:180,sin:0,cos:-1},
      {deg:270,sin:-1,cos:0},{deg:360,sin:0,cos:1}
    ];
    const a=pick(angles);
    const fn=Math.random()>.5?'sin':'cos';
    const ans=fn==='sin'?a.sin:a.cos;
    return{text:`${fn}(${a.deg}°) = ?\n(round to 4 decimals)`,answer:ans,type:'Trigonometry',lv};
  }else if(variant===1){
    // log base
    const bases=[2,3,5,10];
    const base=pick(bases);
    const exp=rand(1,5);
    const val=Math.pow(base,exp);
    return{text:`log_${base}(${val}) = ?`,answer:exp,type:'Logarithm',lv};
  }else if(variant===2){
    // Derivative: f(x)=ax^n, f'(x) at x=k
    const a=rand(1,6),n=rand(2,4),k=rand(1,4);
    const deriv=a*n*Math.pow(k,n-1);
    return{text:`f(x) = ${a}x^${n}\nf'(${k}) = ?`,answer:deriv,type:'Calculus',lv};
  }else if(variant===3){
    // Combination C(n,r)
    const n=rand(4,8),r=rand(2,Math.min(n-1,4));
    const fact=x=>{let v=1;for(let i=2;i<=x;i++)v*=i;return v};
    const ans=fact(n)/(fact(r)*fact(n-r));
    return{text:`C(${n}, ${r}) = ?`,answer:ans,type:'Combinatorics',lv};
  }else{
    // Geometric series sum: a(1-r^n)/(1-r)
    const a=rand(1,4),r=2,n=rand(3,5);
    const sum=a*(Math.pow(r,n)-1)/(r-1);
    return{text:`Geo series: a=${a}, r=${r}, n=${n}\nSum = ?`,answer:sum,type:'Sequences',lv};
  }
}

/* ========== State ========== */
let mode='solo',players=[],turn=0,qCount=0;
const TOTAL_Q=20;
let currentQ=null,answered=false;

/* ========== Screens ========== */
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $(id).classList.add('active');
}
function goMenu(){stopBGM();show('menuScreen')}
function showRoomScreen(){
  sfxClick();show('roomScreen');
  $('createSection').style.display='';
  $('roomCodeBox').style.display='none';
  $('joinSection').style.display='none';
  $('startSection').style.display='none';
  $('slot2').classList.remove('joined');
  $('slot2').querySelector('.status').textContent='—';
  $('slot2').querySelector('.sname').textContent='Waiting…';
  $('slot2').querySelector('.avatar').textContent='⏳';
}

/* ========== Solo ========== */
function startSolo(){
  sfxClick();mode='solo';
  players=[{name:'You',score:0,lv:1,correct:0,wrong:0,_lastCorrect:true}];
  turn=0;qCount=0;
  show('gameScreen');$('modeTag').textContent='Solo Mode · Adaptive Difficulty';
  renderScoreboards();nextQuestion();startBGM();
}

/* ========== Room ========== */
let roomCode='';
function genCode(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<6;i++)s+=c[rand(0,c.length-1)];return s}

function createRoom(){
  sfxClick();
  const name=$('p1Input').value.trim()||'Player 1';
  $('p1Name').textContent=name;
  roomCode=genCode();
  $('roomCode').textContent=roomCode;
  $('roomCodeBox').style.display='block';
  $('createSection').style.display='none';
  $('joinSection').style.display='block';
  // Copy on click
  $('roomCode').onclick=()=>{navigator.clipboard?.writeText(roomCode);$('roomCode').style.opacity='.5';setTimeout(()=>$('roomCode').style.opacity='1',300)};
  // Simulate join
  setTimeout(()=>{
    $('p2Name').textContent='Player 2';
    $('slot2').classList.add('joined');
    $('slot2').querySelector('.status').textContent='Ready';
    $('slot2').querySelector('.avatar').textContent='👤';
    $('joinSection').style.display='none';
    $('startSection').style.display='block';
    sfxClick();
  },2500);
}

function joinRoom(){
  sfxClick();
  const code=$('joinCode').value.trim().toUpperCase();
  const name=$('p2Input').value.trim()||'Player 2';
  if(code.length<4){alert('Please enter a valid room code');return}
  $('p2Name').textContent=name;
  $('slot2').classList.add('joined');
  $('slot2').querySelector('.status').textContent='Ready';
  $('slot2').querySelector('.avatar').textContent='👤';
  $('joinSection').style.display='none';
  $('createSection').style.display='none';
  $('startSection').style.display='block';
}

function startDuel(){
  sfxClick();mode='duel';
  players=[
    {name:$('p1Name').textContent,score:0,lv:1,correct:0,wrong:0,_lastCorrect:true},
    {name:$('p2Name').textContent,score:0,lv:1,correct:0,wrong:0,_lastCorrect:true},
  ];
  turn=0;qCount=0;
  show('gameScreen');$('modeTag').textContent='2-Player PK · Adaptive Difficulty';
  renderScoreboards();nextQuestion();startBGM();
}

/* ========== Game Logic ========== */
function renderScoreboards(){
  const sb=$('scoreboards');sb.innerHTML='';
  players.forEach((p,i)=>{
    const d=document.createElement('div');
    d.className='sb'+(mode==='duel'&&i===turn?' active-turn':'');
    d.innerHTML=`<div class="sb-name">${p.name}</div><div class="sb-score">${p.score}</div><div class="sb-lv">Lv ${p.lv}</div>`;
    sb.appendChild(d);
  });
  const total=mode==='solo'?TOTAL_Q:TOTAL_Q*players.length;
  $('progressFill').style.width=(qCount/total*100)+'%';
  $('progressText').textContent=`Question ${qCount} / ${total}`;
  $('turnLabel').textContent=mode==='duel'?`${players[turn].name}'s Turn`:'';
}

function nextQuestion(){
  answered=false;
  $('submitBtn').style.display='';$('nextBtn').style.display='none';
  $('feedback').className='fb';
  $('answerInput').value='';$('answerInput').disabled=false;$('answerInput').focus();

  const p=players[turn];

  // ✅ Adaptive: correct → lv+1, wrong → lv-1
  if(qCount>0){
    const prev=p._lastCorrect;
    const oldLv=p.lv;
    if(prev)p.lv=Math.min(p.lv+1,10);
    else p.lv=Math.max(p.lv-1,1);
    if(p.lv>oldLv)sfxLevelUp();
    else if(p.lv<oldLv)sfxLevelDown();
  }

  currentQ=genQuestion(p.lv);
  $('qText').textContent=currentQ.text;

  const tags=$('tags');tags.innerHTML='';
  const typeClass=currentQ.type==='Arithmetic'?'tag-arithmetic':currentQ.type==='Algebra'?'tag-algebra':'tag-word';
  tags.innerHTML=`<span class="tag ${typeClass}">${currentQ.type}</span><span class="tag tag-diff">Lv ${p.lv}</span>`;

  renderScoreboards();
}

function submitAnswer(){
  if(answered)return;
  const raw=$('answerInput').value;
  const val=parseInput(raw);
  if(isNaN(val)){$('answerInput').focus();return}
  answered=true;
  $('answerInput').disabled=true;
  $('submitBtn').style.display='none';$('nextBtn').style.display='';

  const p=players[turn];
  const correct=Math.abs(val-currentQ.answer)<0.01;
  const fb=$('feedback');

  if(correct){
    p.score+=10*p.lv;p.correct++;p._lastCorrect=true;
    const nextLv=Math.min(p.lv+1,10);
    fb.className='fb show correct';
    fb.innerHTML=`✅ Correct! &nbsp; Lv ${p.lv} → ${nextLv} &nbsp; (+${10*p.lv})`;
    sfxCorrect();
  }else{
    p.wrong++;p._lastCorrect=false;
    const nextLv=Math.max(p.lv-1,1);
    fb.className='fb show wrong';
    fb.innerHTML=`❌ Wrong! &nbsp; Answer: ${fmt(currentQ.answer)}<br>Lv ${p.lv} → ${nextLv}`;
    sfxWrong();
  }

  qCount++;renderScoreboards();

  const total=mode==='solo'?TOTAL_Q:TOTAL_Q*players.length;
  if(qCount>=total){setTimeout(showResult,1400);return}
  if(mode==='duel')turn=(turn+1)%players.length;
}

document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&$('gameScreen').classList.contains('active')){
    if(!answered)submitAnswer();
    else if($('nextBtn').style.display!=='none')nextQuestion();
  }
});

/* ========== Result ========== */
function showResult(){
  stopBGM();show('resultScreen');
  const rc=$('resultCard');let html='<h2>🏁 Game Over</h2>';

  if(mode==='solo'){
    const p=players[0];
    const acc=p.correct+p.wrong?Math.round(p.correct/(p.correct+p.wrong)*100):0;
    html+=`<div class="winner">Great job, ${p.name}!</div>`;
    html+=`<div class="final-scores"><div class="final-sb winner-box"><div class="fs-name">${p.name}</div><div class="fs-score">${p.score}</div></div></div>`;
    html+=`<div class="detail">✅ ${p.correct} &nbsp; ❌ ${p.wrong} &nbsp; Accuracy: ${acc}%<br>Final Level: ${p.lv}</div>`;
  }else{
    const sorted=[...players].sort((a,b)=>b.score-a.score);
    const tie=sorted[0].score===sorted[1].score;
    html+=`<div class="winner">${tie?"It's a Tie! 🤝":`🏆 ${sorted[0].name} Wins!`}</div>`;
    html+='<div class="final-scores">';
    players.forEach(p=>{
      const w=!tie&&p.score===sorted[0].score;
      html+=`<div class="final-sb ${w?'winner-box':''}"><div class="fs-name">${p.name}</div><div class="fs-score">${p.score}</div></div>`;
    });
    html+='</div><div class="detail">';
    players.forEach(p=>{html+=`${p.name}: ✅${p.correct} ❌${p.wrong} Lv${p.lv} &nbsp; `});
    html+='</div>';
  }

  html+=`<div class="actions"><button class="btn btn-primary" onclick="goMenu()">Back to Menu</button><button class="btn btn-secondary" onclick="${mode==='solo'?'startSolo()':'showRoomScreen()'}">Play Again</button></div>`;
  rc.innerHTML=html;
}
</script>
</body>
</html>

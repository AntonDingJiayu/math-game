<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Practice Arena</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, sans-serif}
body{
  min-height:100vh;
  background:linear-gradient(135deg,#121524,#1c2340);
  color:#fff;
  display:flex;align-items:center;justify-content:center;
  padding:20px;overflow:hidden;
}
#particles{
  position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;
}
.wrap{
  position:relative;z-index:1;
  width:min(900px,100%);
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(12px);
  border-radius:20px;border:1px solid rgba(255,255,255,0.15);
  padding:32px;box-shadow:0 10px 40px rgba(0,0,0,0.3);
}
h1{text-align:center;margin-bottom:24px;color:#e8f0ff}
.menu{display:flex;flex-direction:column;gap:16px;align-items:center}
.btn{
  padding:14px 32px;border:none;border-radius:12px;
  font-size:18px;font-weight:bold;cursor:pointer;
  background:linear-gradient(90deg,#477bff,#7254ff);
  color:white;transition:0.2s;
}
.btn:hover{transform:scale(1.04);box-shadow:0 0 18px #557cff88}
.quiz-area{display:none}
.info-row{display:flex;justify-content:space-between;margin-bottom:16px;font-size:17px}
.question{
  font-size:24px;text-align:center;margin:28px 0;
  min-height:70px;display:flex;align-items:center;justify-content:center;
}
.input-wrap{display:flex;gap:10px;justify-content:center;margin-bottom:20px}
#ansInput{
  width:340px;padding:14px 16px;font-size:20px;border-radius:10px;
  border:1px solid rgba(255,255,255,0.2);background:rgba(255,255,255,0.09);
  color:#fff;outline:none;
}
#ansInput:focus{border-color:#688eff}
.feedback{text-align:center;font-size:20px;height:30px;margin-bottom:12px}
.correct{color:#73ff9b}
.wrong{color:#ff7c7c}
.stat{display:flex;gap:24px;justify-content:center;margin-top:12px;color:#c8d4ee}
/* 67彩蛋特效容器 */
#egg67Container{
  position:fixed;top:0;left:0;width:100vw;height:100vh;
  pointer-events:none;z-index:999;overflow:hidden;
}
.egg67-text{
  position:absolute;font-size:60px;font-weight:bold;
  color:#ffdd44;text-shadow:0 0 12px #ffaa00;
}
</style>
</head>
<body>
<div id="particles"></div>
<div id="egg67Container"></div>
<div class="wrap">
  <div class="menu" id="mainMenu">
    <h1>Math Practice Arena</h1>
    <button class="btn" onclick="startSingle()">Start Single Practice</button>
  </div>

  <div class="quiz-area" id="quizBox">
    <div class="info-row">
      <span>Score: <span id="score">0</span></span>
      <span>Level: <span id="level">1</span> / 20</span>
    </div>
    <div class="question" id="question"></div>
    <div class="input-wrap">
      <input type="text" id="ansInput" placeholder="Type your answer here..." autocomplete="off">
      <button class="btn" onclick="submitAnswer()">Submit</button>
    </div>
    <div class="feedback" id="feedback"></div>
    <div class="stat">
      <span>Correct: <span id="cntCorrect">0</span></span>
      <span>Wrong: <span id="cntWrong">0</span></span>
    </div>
    <div style="text-align:center;margin-top:24px">
      <button class="btn" onclick="backMenu()">Back to Menu</button>
    </div>
  </div>
</div>

let score = 0;
let level = 1;
let cntCorrect = 0;
let cntWrong = 0;
let currentQ = null;
const MAX_LEVEL = 20;

const menu = document.getElementById("mainMenu");
const quizBox = document.getElementById("quizBox");
const qDom = document.getElementById("question");
const ansInput = document.getElementById("ansInput");
const feedbackDom = document.getElementById("feedback");
const scoreDom = document.getElementById("score");
const levelDom = document.getElementById("level");
const cDom = document.getElementById("cntCorrect");
const wDom = document.getElementById("cntWrong");
const egg67Container = document.getElementById("egg67Container");

const EGG_TEXT = "Anton is handsome";

// 67特效函数
function trigger67Effect(){
  for(let i=0;i<60;i++){
    const span = document.createElement("span");
    span.className = "egg67-text";
    span.innerText = "67";
    span.style.left = Math.random()*100 + "vw";
    span.style.top = Math.random()*100 + "vh";
    span.style.transform = `rotate(${Math.random()*360}deg)`;
    span.style.opacity = 1;
    egg67Container.appendChild(span);
    // 淡出动画
    setTimeout(()=>{
      span.style.transition = "opacity 1.8s";
      span.style.opacity = 0;
    }, 100);
    setTimeout(()=>span.remove(),2000);
  }
}

function startSingle(){
  score=0;level=1;cntCorrect=0;cntWrong=0;
  updateUI();
  menu.style.display="none";
  quizBox.style.display="block";
  nextQuestion();
}

function nextQuestion(){
  feedbackDom.textContent="";
  const pool = allBanks[level-1];
  const idx = Math.floor(Math.random() * pool.length);
  currentQ = pool[idx];
  qDom.textContent = currentQ.q;
  ansInput.value="";
  ansInput.focus();
}

function submitAnswer(){
  const userStr = ansInput.value.trim();
  // Anton彩蛋
  if(userStr === EGG_TEXT){
    feedbackDom.textContent = "✅ Correct! 🎉";
    feedbackDom.className = "correct";
    score += 10;
    cntCorrect++;
    checkLevelUp();
    updateUI();
    setTimeout(nextQuestion,900);
    return;
  }
  // 67彩蛋：判错，但是播放特效
  if(userStr === "67"){
    trigger67Effect();
    feedbackDom.textContent = "❌ Wrong! Answer: " + currentQ.a;
    feedbackDom.className = "wrong";
    cntWrong++;
    checkLevelUp();
    updateUI();
    setTimeout(nextQuestion,900);
    return;
  }

  const userAns = parseFloat(userStr);
  const realAns = currentQ.a;
  if(isNaN(userAns)){
    feedbackDom.textContent="❌ Invalid number";
    feedbackDom.className="wrong";
    return;
  }
  if(Math.abs(userAns - realAns) < 0.001){
    feedbackDom.textContent = "✅ Correct!";
    feedbackDom.className = "correct";
    score += 10;
    cntCorrect++;
  }else{
    feedbackDom.textContent = `❌ Wrong! Answer: ${realAns}`;
    feedbackDom.className = "wrong";
    cntWrong++;
  }
  checkLevelUp();
  updateUI();
  setTimeout(nextQuestion,900);
}

function checkLevelUp(){
  const newLv = Math.floor(cntCorrect / 5) + 1;
  if(newLv > MAX_LEVEL) level = MAX_LEVEL;
  else level = newLv;
}
function updateUI(){
  scoreDom.textContent=score;
  levelDom.textContent=level;
  cDom.textContent=cntCorrect;
  wDom.textContent=cntWrong;
}
function backMenu(){
  quizBox.style.display="none";
  menu.style.display="flex";
}
ansInput.addEventListener("keydown",e=>{
  if(e.key==="Enter") submitAnswer();
})

// 粒子背景
const canvas = document.createElement("canvas");
canvas.id="particles";
document.body.prepend(canvas);
const ctx = canvas.getContext("2d");
let w,h;
function resize(){
  w=canvas.width=innerWidth;
  h=canvas.height=innerHeight;
}
resize();
window.addEventListener("resize",resize);
const particles = [];
for(let i=0;i<70;i++){
  particles.push({
    x:Math.random()*w,y:Math.random()*h,
    r:Math.random()*2+0.4,
    vx:(Math.random()-0.5)*0.55,
    vy:(Math.random()-0.5)*0.55
  })
}
function draw(){
  ctx.clearRect(0,0,w,h);
  ctx.fillStyle="#ffffff22";
  for(let p of particles){
    p.x += p.vx;
    p.y += p.vy;
    if(p.x<0||p.x>w)p.vx*=-1;
    if(p.y<0||p.y>h)p.vy*=-1;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fill();
  }
  requestAnimationFrame(draw);
}
draw();
</script>

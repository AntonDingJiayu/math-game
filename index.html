<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Math PK Arena</title>
<style>

*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a1a;--bg2:#1a1a3e;--bg3:#0f0c29;
  --card:rgba(255,255,255,.06);--card-border:rgba(255,255,255,.1);
  --card-border-hover:rgba(255,255,255,.2);
  --accent:#7f5af0;--accent2:#2cb67d;--danger:#e53170;--warn:#f9c74f;
  --text:#fffffe;--text2:#94a1b2;--text3:#6b7280;
  --radius:18px;--shadow:0 8px 32px rgba(0,0,0,.4);
  --glow-accent:0 0 20px rgba(127,90,240,.4);
  --glow-accent2:0 0 20px rgba(44,182,125,.4);
}
body{
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;
  display:flex;justify-content:center;align-items:center;position:relative;
}
/* 动态渐变背景球 */
.bg-orbs{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-2;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.35;animation:floatOrb 20s infinite ease-in-out}
.orb:nth-child(1){width:400px;height:400px;background:radial-gradient(circle,var(--accent),transparent 70%);top:-10%;left:-10%;animation-delay:0s}
.orb:nth-child(2){width:350px;height:350px;background:radial-gradient(circle,var(--accent2),transparent 70%);top:50%;right:-10%;animation-delay:-5s}
.orb:nth-child(3){width:300px;height:300px;background:radial-gradient(circle,#f9c74f30,transparent 70%);bottom:-10%;left:30%;animation-delay:-10s}
.orb:nth-child(4){width:250px;height:250px;background:radial-gradient(circle,#e5317040,transparent 70%);top:30%;left:50%;animation-delay:-15s}
@keyframes floatOrb{0%,100%{transform:translate(0,0) scale(1)}25%{transform:translate(50px,-50px) scale(1.1)}50%{transform:translate(-30px,60px) scale(.95)}75%{transform:translate(60px,30px) scale(1.05)}}
/* 点阵网格背景 */
.bg-grid{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;
  background-image:radial-gradient(rgba(255,255,255,.04) 1px,transparent 1px);
  background-size:40px 40px;pointer-events:none}
/* 浮动粒子 */
.particles{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none;overflow:hidden}
.particle{position:absolute;width:3px;height:3px;background:rgba(255,255,255,.25);border-radius:50%;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(100vh) translateX(0) scale(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-10vh) translateX(100px) scale(1);opacity:0}}

.screen{display:none;width:100%;max-width:540px;padding:20px;animation:fadeIn .5s cubic-bezier(.22,1,.36,1)}
.screen.active{display:flex;flex-direction:column;align-items:center;gap:20px}
@keyframes fadeIn{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 15px rgba(127,90,240,.3)}50%{box-shadow:0 0 30px rgba(127,90,240,.6)}}
@keyframes shakeX{0%,100%{transform:translateX(0)}15%,45%,75%{transform:translateX(-5px)}30%,60%,90%{transform:translateX(5px)}}
@keyframes scaleIn{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes gradientShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}

h1{
  font-size:2.2rem;font-weight:900;
  background:linear-gradient(135deg,#7f5af0,#2cb67d,#f9c74f,#7f5af0);
  background-size:300% 300%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  text-align:center;line-height:1.2;animation:gradientShift 4s ease infinite,float 3s ease-in-out infinite;
  filter:drop-shadow(0 0 20px rgba(127,90,240,.3));
}
h2{font-size:1.5rem;text-align:center;animation:slideUp .5s ease}
.subtitle{color:var(--text2);font-size:.95rem;text-align:center;margin-top:-6px;animation:slideUp .5s ease .1s both}

/* 增强玻璃拟态卡片 */
.card{
  background:var(--card);border:1px solid var(--card-border);
  border-radius:var(--radius);padding:28px;width:100%;
  backdrop-filter:blur(16px) saturate(150%);-webkit-backdrop-filter:blur(16px) saturate(150%);
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.05);
  transition:all .3s cubic-bezier(.22,1,.36,1);position:relative;overflow:hidden;
}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent)}
.card:hover{border-color:var(--card-border-hover);box-shadow:var(--shadow),0 0 30px rgba(127,90,240,.1),inset 0 1px 0 rgba(255,255,255,.08)}

/* 增强按钮 */
.btn{
  border:none;border-radius:14px;padding:15px 30px;font-size:1rem;font-weight:700;
  cursor:pointer;transition:all .25s cubic-bezier(.22,1,.36,1);width:100%;letter-spacing:.5px;
  position:relative;overflow:hidden;
}
.btn::after{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);transition:left .5s}
.btn:hover::after{left:100%}
.btn-primary{background:linear-gradient(135deg,var(--accent),#6b4fe0);color:#fff;box-shadow:0 4px 15px rgba(127,90,240,.3)}
.btn-primary:hover{transform:translateY(-3px);box-shadow:0 6px 25px rgba(127,90,240,.45)}
.btn-primary:active{transform:translateY(-1px) scale(.98)}
.btn-secondary{background:rgba(255,255,255,.08);color:var(--text);border:1px solid var(--card-border)}
.btn-secondary:hover{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.2);transform:translateY(-2px)}
.btn-secondary:active{transform:translateY(0) scale(.98)}
.btn-danger{background:linear-gradient(135deg,var(--danger),#c42050);color:#fff;box-shadow:0 4px 15px rgba(229,49,112,.3)}
.btn:active{transform:scale(.97)}

/* 增强输入框 */
input[type=text],input[type=number]{
  width:100%;padding:15px 18px;border-radius:14px;border:1px solid var(--card-border);
  background:rgba(255,255,255,.05);color:#fff;font-size:1.1rem;outline:none;
  transition:all .25s;text-align:center;box-shadow:inset 0 2px 4px rgba(0,0,0,.1);
}
input[type=text]:focus,input[type=number]:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(127,90,240,.15),inset 0 2px 4px rgba(0,0,0,.1);background:rgba(255,255,255,.08)}
input::placeholder{color:var(--text3)}

/* 声音按钮 */
.sound-btn{
  position:fixed;top:20px;right:20px;z-index:99;
  width:48px;height:48px;border-radius:50%;border:1px solid var(--card-border);
  background:var(--card);backdrop-filter:blur(12px);cursor:pointer;
  font-size:1.4rem;display:flex;align-items:center;justify-content:center;
  transition:all .3s;box-shadow:0 4px 12px rgba(0,0,0,.2);
}
.sound-btn:hover{background:rgba(255,255,255,.12);transform:scale(1.1);box-shadow:0 6px 20px rgba(0,0,0,.3)}

/* 品牌标识 */
.brand{position:fixed;top:22px;left:24px;z-index:99;font-size:.8rem;font-weight:700;color:rgba(255,255,255,.35);letter-spacing:.8px;user-select:none}

/* 房间槽位 */
.slots{display:flex;gap:12px;width:100%;flex-wrap:wrap;justify-content:center}
.slot{
  width:calc(33.33% - 12px);min-width:120px;max-width:160px;
  background:rgba(255,255,255,.03);border:1px dashed rgba(255,255,255,.12);
  border-radius:14px;padding:16px;text-align:center;transition:all .3s;backdrop-filter:blur(8px);
}
.slot.joined{border-style:solid;border-color:var(--accent2);background:rgba(44,182,125,.06);box-shadow:0 0 15px rgba(44,182,125,.15);animation:scaleIn .3s ease}
.slot .avatar{font-size:2rem;margin-bottom:6px;animation:float 3s ease-in-out infinite}
.slot.joined .avatar{animation:none}
.slot .sname{font-weight:700;font-size:.95rem}
.slot .status{font-size:.8rem;color:var(--text2);margin-top:4px}
.slot.empty .avatar{opacity:.35}

/* 房间号显示 */
.room-code-display{
  font-size:2.5rem;font-weight:900;letter-spacing:8px;text-align:center;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  margin:12px 0;padding:12px 24px;background-clip:text;cursor:pointer;
  transition:all .3s;filter:drop-shadow(0 0 10px rgba(127,90,240,.3));
}
.room-code-display:hover{transform:scale(1.05);filter:drop-shadow(0 0 20px rgba(127,90,240,.5))}

/* 玩家加入表单 */
.join-form{width:100%;margin-top:10px}
.join-form .card{padding:20px}
.join-form-row{display:flex;gap:8px;width:100%}
.join-form-row input{flex:1}
.join-form-row .btn{width:auto;padding:15px 24px}

/* 游戏区域 */
.q-card{text-align:center;padding:36px 28px;border:1px solid var(--card-border);background:linear-gradient(135deg,rgba(127,90,240,.05),rgba(44,182,125,.05))}
.q-card.new-q{animation:scaleIn .3s ease}
.q-text{font-size:2rem;font-weight:800;line-height:1.4;margin:16px 0 24px;word-break:break-word;min-height:60px;display:flex;align-items:center;justify-content:center}
.tags{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
.tag{padding:5px 14px;border-radius:20px;font-size:.8rem;font-weight:700;letter-spacing:.5px}
.tag-arithmetic{background:rgba(127,90,240,.2);color:#b4a0ff;border:1px solid rgba(127,90,240,.2)}
.tag-algebra{background:rgba(44,182,125,.2);color:#6ee7b7;border:1px solid rgba(44,182,125,.2)}
.tag-word{background:rgba(249,199,79,.15);color:#f9c74f;border:1px solid rgba(249,199,79,.2)}
.tag-diff{background:rgba(255,255,255,.08);color:var(--text2);border:1px solid rgba(255,255,255,.1)}

/* 反馈 */
.fb{margin-top:14px;padding:14px 18px;border-radius:14px;font-weight:700;text-align:center;font-size:1rem;opacity:0;transition:all .3s}
.fb.show{opacity:1;animation:slideUp .3s ease}
.fb.correct{background:rgba(44,182,125,.12);color:#6ee7b7;border:1px solid rgba(44,182,125,.25)}
.fb.wrong{background:rgba(229,49,112,.12);color:#ff8fab;border:1px solid rgba(229,49,112,.2);animation:shakeX .5s}

/* 计分板 */
.scoreboards{display:flex;gap:12px;width:100%;flex-wrap:wrap;justify-content:center}
.sb{flex:1 1 110px;min-width:110px;max-width:170px;background:var(--card);border:1px solid var(--card-border);border-radius:14px;padding:14px;text-align:center;transition:all .3s;backdrop-filter:blur(8px)}
.sb.active-turn{border-color:var(--accent);box-shadow:var(--glow-accent);animation:pulseGlow 2s infinite}
.sb-name{font-size:.85rem;color:var(--text2);margin-bottom:6px}
.sb-score{font-size:1.8rem;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sb-lv{font-size:.75rem;color:var(--accent);margin-top:4px;font-weight:700}

/* 进度条 */
.progress-bar{width:100%;height:8px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden;position:relative}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:4px;transition:width .5s cubic-bezier(.22,1,.36,1);position:relative}
.progress-fill::after{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);animation:shimmer 2s infinite}
.progress-text{font-size:.8rem;color:var(--text2);text-align:center;margin-top:6px}
.turn-label{font-size:.9rem;color:var(--accent);font-weight:700;text-align:center;min-height:1.4em;animation:fadeIn .3s}

/* 结果页面 */
.winner{font-size:1.5rem;font-weight:900;text-align:center;margin:10px 0;background:linear-gradient(135deg,#f9c74f,#f9844a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:float 2s ease-in-out infinite;filter:drop-shadow(0 0 15px rgba(249,199,79,.4))}
.final-scores{display:flex;gap:14px;width:100%;margin:14px 0;flex-wrap:wrap;justify-content:center}
.final-sb{flex:1 1 130px;min-width:130px;max-width:190px;background:var(--card);border:1px solid var(--card-border);border-radius:16px;padding:20px;text-align:center;transition:all .3s;backdrop-filter:blur(8px)}
.final-sb:hover{transform:translateY(-4px);box-shadow:0 8px 25px rgba(0,0,0,.3)}
.final-sb.winner-box{border-color:var(--warn);background:rgba(249,199,79,.06);box-shadow:0 0 25px rgba(249,199,79,.15)}
.fs-rank{font-size:.85rem;color:var(--accent);font-weight:700;margin-bottom:4px}
.fs-name{font-size:.9rem;color:var(--text2)}
.fs-score{font-size:2.2rem;font-weight:900;margin-top:6px}
.detail{font-size:.85rem;color:var(--text2);text-align:center;line-height:1.8}

/* 排名表格 */
.ranking-table{width:100%;border-collapse:separate;border-spacing:0 4px;margin:14px 0;font-size:.9rem}
.ranking-table th{background:rgba(255,255,255,.08);padding:12px 10px;text-align:center;font-weight:700;color:var(--text2);letter-spacing:.5px}
.ranking-table th:first-child{border-radius:8px 0 0 8px}
.ranking-table th:last-child{border-radius:0 8px 8px 0}
.ranking-table td{padding:12px 10px;text-align:center;border-bottom:1px solid rgba(255,255,255,.04);transition:all .2s}
.ranking-table tr:hover td{background:rgba(255,255,255,.03)}
.ranking-table tr:first-child td{color:var(--warn);font-weight:700;background:rgba(249,199,79,.04)}
.ranking-table .rank-badge{font-size:1.2rem;font-weight:900;width:40px}

/* 按钮组 */
.actions{display:flex;gap:12px;width:100%;margin-top:8px}
.actions .btn{flex:1}

/* 网络状态 */
#remoteJoinSection .card{padding:20px}
.network-badge{display:inline-block;padding:4px 10px;border-radius:12px;font-size:.75rem;font-weight:700;margin-left:6px}
.network-badge.online{background:rgba(44,182,125,.15);color:#6ee7b7}
.network-badge.offline{background:rgba(229,49,112,.15);color:#ff8fab}

/* 响应式 */
@media(max-width:480px){
  h1{font-size:1.7rem}.q-text{font-size:1.5rem}.room-code-display{font-size:2rem;letter-spacing:5px}
  .slot{width:calc(50% - 8px);min-width:100px}
  .card{padding:22px}
  .btn{padding:13px 24px;font-size:.95rem}
}

</style></style>
</head>
<body>
<!-- 视觉效果层 -->
<div class="bg-orbs"><div class="orb"></div><div class="orb"></div><div class="orb"></div><div class="orb"></div></div>
<div class="bg-grid"></div>
<div class="particles" id="particles"></div>


<button class="sound-btn" id="soundToggle" onclick="toggleSound()">🔇</button>
<div class="brand">Made by AntonDing</div>

<!-- MENU -->
<div class="screen active" id="menuScreen">
  <h1>🧮 Math PK Arena</h1>
  <p class="subtitle">从小学到高中 · 自适应难度 · 多人对战</p>
  <div class="card" style="display:flex;flex-direction:column;gap:12px">
    <button class="btn btn-primary" onclick="startSolo()">🎯 Solo Practice</button>
    <button class="btn btn-secondary" onclick="showRoomScreen()">⚔️ Multiplayer PK (2-6 Players)</button>
    <button class="btn btn-secondary" onclick="showRemoteJoinScreen()">🌐 Join Room by Code</button>
  </div>
</div>

<!-- ROOM -->
<div class="screen" id="roomScreen">
  <h2>⚔️ Battle Room</h2>
  <p class="subtitle">创建或加入房间，与好友多人PK (最多6人)</p>

  <div class="card" id="createSection">
    <label style="font-size:.85rem;color:var(--text2);margin-bottom:6px;display:block">Your Name</label>
    <input type="text" id="p1Input" placeholder="Player 1" maxlength="10">
    <button class="btn btn-primary" style="margin-top:12px" onclick="createRoom()">Create Room</button>
  </div>

  <div class="card" id="roomCodeBox" style="display:none;text-align:center">
    <div style="font-size:.85rem;color:var(--text2)">Room Code</div>
    <div class="room-code-display" id="roomCode" title="Click to copy"></div>
    <div class="slots" id="playerSlots"></div>
    <div style="font-size:.8rem;color:var(--text2);margin-top:8px" id="playerCount"></div>
  </div>

  <div class="card join-form" id="joinSection" style="display:none">
    <div style="font-size:.85rem;color:var(--text2);margin-bottom:8px;text-align:center">Join as Player</div>
    <input type="text" id="joinNameInput" placeholder="Enter your name" maxlength="10" style="margin-bottom:8px">
    <button class="btn btn-primary" style="width:100%" onclick="joinRoom()">Join Room</button>
    <div id="joinedPlayersList" style="margin-top:12px;text-align:center"></div>
  </div>

  <!-- 通过房间号加入别人房间 -->
  <div class="card join-form" id="remoteJoinSection" style="display:none">
    <div style="font-size:.85rem;color:var(--text2);margin-bottom:8px;text-align:center">Join Someone Else's Room</div>
    <input type="text" id="remoteRoomCodeInput" placeholder="Enter Room Code" maxlength="10" style="margin-bottom:8px;text-transform:uppercase">
    <input type="text" id="remoteNameInput" placeholder="Your Name" maxlength="10" style="margin-bottom:8px">
    <button class="btn btn-primary" style="width:100%" onclick="joinRemoteRoom()">Join Room</button>
    <div id="remoteJoinStatus" style="margin-top:8px;text-align:center;font-size:.85rem;color:var(--text2)"></div>
  </div>

  <!-- 网络状态指示器 -->
  <div id="networkStatus" style="display:none;width:100%;text-align:center">
    <div style="font-size:.8rem;color:var(--accent2);margin-bottom:4px" id="networkStatusText"></div>
  </div>

  </div>

  <div id="startSection" style="display:none;width:100%">
    <button class="btn btn-primary" onclick="startDuel()">🚀 Start Battle!</button>
  </div>

  <button class="btn btn-secondary" onclick="goMenu()" style="margin-top:4px">← Back</button>
</div>

<!-- GAME -->
<div class="screen" id="gameScreen">
  <div class="turn-label" id="turnLabel"></div>
  <div class="scoreboards" id="scoreboards"></div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-text" id="progressText"></div>

  <div class="card q-card">
    <div class="tags" id="tags"></div>
    <div class="q-text" id="qText"></div>
    <input type="text" id="answerInput" placeholder="Your answer…" autocomplete="off" inputmode="decimal">
    <div class="fb" id="feedback"></div>
    <div style="display:flex;gap:10px;margin-top:16px">
      <button class="btn btn-primary" id="submitBtn" onclick="submitAnswer()">Submit</button>
      <button class="btn btn-secondary" id="nextBtn" onclick="nextQuestion()" style="display:none">Next →</button>
    </div>
  </div>
  <div style="font-size:.75rem;color:var(--text2);text-align:center" id="modeTag"></div>
</div>

<!-- RESULT -->
<div class="screen" id="resultScreen">
  <div class="card" id="resultCard" style="display:flex;flex-direction:column;gap:10px"></div>
</div>

<script>

/* ========== 增强音频引擎 ========== */
let audioCtx=null, soundOn=false, masterGain=null;
function ensureAudio(){
  if(!audioCtx){
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    masterGain=audioCtx.createGain();
    masterGain.gain.setValueAtTime(0.5,audioCtx.currentTime);
    masterGain.connect(audioCtx.destination);
  }
}

// 创建带包络的振荡器
function playTone(freq,dur,type='sine',vol=0.1,delay=0,attack=0.01,release=0.1){
  if(!soundOn)return;ensureAudio();
  const t=audioCtx.currentTime+delay;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);
  // 包络
  g.gain.setValueAtTime(0.001,t);
  g.gain.linearRampToValueAtTime(vol,t+attack);
  g.gain.setValueAtTime(vol,t+dur-release);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(masterGain||audioCtx.destination);
  o.start(t);o.stop(t+dur+0.01);
  return{o,g};
}

// 创建噪声源（用于打击乐效果）
function playNoise(dur,vol=0.05,type='white'){
  if(!soundOn)return;ensureAudio();
  const bufferSize=audioCtx.sampleRate*dur;
  const buffer=audioCtx.createBuffer(1,bufferSize,audioCtx.sampleRate);
  const data=buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++) data[i]=Math.random()*2-1;
  const source=audioCtx.createBufferSource();
  source.buffer=buffer;
  const g=audioCtx.createGain();
  const t=audioCtx.currentTime;
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  source.connect(g);g.connect(masterGain||audioCtx.destination);
  source.start(t);source.stop(t+dur);
}

let bgmTimer=null,bgmPlaying=false,bgmIdx=0;

// 和弦进行（更丰富的和声）
const bgmChords=[
  {root:261.6,third:329.6,fifth:392.0,seventh:493.9,name:'Cmaj7'},    // C大七
  {root:220.0,third:261.6,fifth:329.6,seventh:392.0,name:'Am7'},       // A小七

  {root:196.0,third:246.9,fifth:293.7,seventh:392.0,name:'G7'},       // G七
];

const bgmNoteDur=0.18, bgmInterval=220;

function startBGM(){
  if(bgmPlaying)return;bgmPlaying=true;bgmIdx=0;tickBGM();
}
function tickBGM(){
  if(!bgmPlaying)return;
  const chordIdx=Math.floor(bgmIdx/4)%bgmChords.length;
  const chord=bgmChords[chordIdx];
  const noteInChord=bgmIdx%4;
  
  // 层1: 和弦分解旋律（三角波，柔和）
  const noteFreqs=[chord.root*2,chord.third*2,chord.fifth*2,chord.seventh*2];
  playTone(noteFreqs[noteInChord],bgmNoteDur,'triangle',0.018,0,0.005,0.05);
  
  // 层2: 贝斯线（每小节第一个音）
  if(noteInChord===0){
    playTone(chord.root/2,0.35,'sine',0.04,0,0.02,0.1);
  }
  
  // 层3: 和弦铺底（每4拍和弦）
  if(noteInChord===0 && bgmIdx>4){
    playTone(chord.root,0.8,'sine',0.008,0,0.05,0.3);
    playTone(chord.fifth,0.8,'sine',0.005,0,0.05,0.3);
  }
  
  bgmIdx++;
  bgmTimer=setTimeout(tickBGM,bgmInterval);
}
function stopBGM(){bgmPlaying=false;clearTimeout(bgmTimer)}

}

function genWordProblem(lv) {
  const pool = wordProblems.filter((_, i) => {
    if (lv <= 3) return i < 5;
    if (lv <= 6) return i < 8;
    return true;
  });
  const wp = pick(pool);
  return { ...wp.gen(lv), type: 'Word Problem', lv };
}


/* ========== Question Generator (Lv1–10, elementary→high school) ========== */
function genQuestion(lv){
  lv=clamp(lv,1,10);

  if(Math.random() < 0.20){
    return genWordProblem(lv);
  }

  if(lv<=2){
    const ops=['+','-','×'];
    const op=pick(ops);
    let a,b,ans,text;
    if(op==='+'){a=rand(1,10*lv);b=rand(1,10*lv);ans=a+b;text=`${a} + ${b} = ?`}
    else if(op==='-'){a=rand(2,12*lv);b=rand(1,a);ans=a-b;text=`${a} − ${b} = ?`}
    else{a=rand(2,5*lv);b=rand(2,5*lv);ans=a*b;text=`${a} × ${b} = ?`}
    return{text,answer:ans,type:'Arithmetic',lv};
  }

  if(lv<=4){
    const variant=rand(0,2);
    if(variant===0){
      const a=rand(2,8),b=rand(2,8),c=rand(1,10);
      const ans=a*b+c;return{text:`${a} × ${b} + ${c} = ?`,answer:ans,type:'Arithmetic',lv};
    }else if(variant===1){
      const b=rand(2,9),ans=rand(2,12),a=b*ans;
      return{text:`${a} ÷ ${b} = ?`,answer:ans,type:'Arithmetic',lv};
    }else{
      const a=rand(10,30),b=rand(10,30),c=rand(1,15);
      const ans=a+b-c;return{text:`${a} + ${b} − ${c} = ?`,answer:ans,type:'Arithmetic',lv};
    }
  }

  if(lv<=6){
    const variant=rand(0,2);
    if(variant===0){
      const a=rand(2,9),b=rand(2,9),c=rand(2,9),d=rand(2,9);
      const ans=a+b*c-d;return{text:`${a} + ${b} × ${c} − ${d} = ?`,answer:ans,type:'Arithmetic',lv};
    }else if(variant===1){
      const x=rand(-10,10),a=rand(2,8),b=rand(-20,20);
      const c=a*x+b;
      return{text:`Solve: ${a}x + (${b}) = ${c}`,answer:x,type:'Algebra',lv};
    }else{
      const a=rand(3,12),b=rand(3,12);
      return{text:`(${a})² − (${b})² = ?`,answer:a*a-b*b,type:'Arithmetic',lv};
    }
  }

  if(lv<=8){
    const variant=rand(0,3);
    if(variant===0){
      const p=rand(-9,9),q=rand(-9,9);
      return{text:`x² − ${p+q}x + ${p*q} = 0\nSum of roots = ?`,answer:p+q,type:'Algebra',lv};
    }else if(variant===1){
      const n=rand(2,12);
      return{text:`√${n*n} + √${(n+1)*(n+1)} = ?`,answer:n+(n+1),type:'Arithmetic',lv};
    }else if(variant===2){
      const a1=rand(1,10),d=rand(2,6),n=rand(5,12);
      const an=a1+(n-1)*d;
      return{text:`Arithmetic seq: a₁=${a1}, d=${d}\na_${n} = ?`,answer:an,type:'Algebra',lv};
    }else{
      const x=rand(-8,8),a=rand(2,6),b=rand(-10,10);
      const c=Math.abs(a*x+b);
      const x2=(-c-b)/a;
      return{text:`|${a}x + ${b}| = ${c}\nLarger x = ?`,answer:Math.max(x,x2),type:'Algebra',lv};
    }
  }

  const variant=rand(0,4);
  if(variant===0){
    const angles=[
      {deg:0,sin:0,cos:1},{deg:30,sin:0.5,cos:0.866},
      {deg:45,sin:0.7071,cos:0.7071},{deg:60,sin:0.866,cos:0.5},
      {deg:90,sin:1,cos:0},{deg:180,sin:0,cos:-1},
      {deg:270,sin:-1,cos:0},{deg:360,sin:0,cos:1}
    ];
    const a=pick(angles);
    const fn=Math.random()>.5?'sin':'cos';
    const ans=fn==='sin'?a.sin:a.cos;
    return{text:`${fn}(${a.deg}°) = ?\n(round to 4 decimals)`,answer:ans,type:'Trigonometry',lv};
  }else if(variant===1){
    const bases=[2,3,5,10];
    const base=pick(bases);
    const exp=rand(1,5);
    const val=Math.pow(base,exp);
    return{text:`log_${base}(${val}) = ?`,answer:exp,type:'Logarithm',lv};
  }else if(variant===2){
    const a=rand(1,6),n=rand(2,4),k=rand(1,4);
    const deriv=a*n*Math.pow(k,n-1);
    return{text:`f(x) = ${a}x^${n}\nf'(${k}) = ?`,answer:deriv,type:'Calculus',lv};
  }else if(variant===3){
    const n=rand(4,8),r=rand(2,Math.min(n-1,4));
    const fact=x=>{let v=1;for(let i=2;i<=x;i++)v*=i;return v};
    const ans=fact(n)/(fact(r)*fact(n-r));
    return{text:`C(${n}, ${r}) = ?`,answer:ans,type:'Combinatorics',lv};
  }else{
    const a=rand(1,4),r=2,n=rand(3,5);
    const sum=a*(Math.pow(r,n)-1)/(r-1);
    return{text:`Geo series: a=${a}, r=${r}, n=${n}\nSum = ?`,answer:sum,type:'Sequences',lv};
  }
}

/** 设置当前标签页为房间主机 */
function setupHostRoom(code){
  isHost = true;
  const channelName = NET_CHANNEL_PREFIX + code;
  try {
    netChannel = new BroadcastChannel(channelName);
    netChannel.onmessage = handleNetworkMessage;
    showNetworkStatus('Host Mode - Share room code with friends', 'online');
    console.log('[MathPK] Host room created:', channelName);
  } catch(e) {
    console.warn('[MathPK] BroadcastChannel not supported:', e);
    showNetworkStatus('BroadcastChannel not supported', 'offline');
  }
}

/** 通过房间号加入别人的房间 */
function joinRemoteRoom(){
  sfxClick();sfxJoin();
  const code = $('remoteRoomCodeInput').value.trim().toUpperCase();
  const name = $('remoteNameInput').value.trim() || 'Player ' + (roomPlayers.length + 1);
  
  if(!code){
    $('remoteJoinStatus').textContent = 'Please enter a room code';
    $('remoteJoinStatus').style.color = 'var(--danger)';
    return;
  }
  
  if(name.length < 1){
    $('remoteJoinStatus').textContent = 'Please enter your name';
    $('remoteJoinStatus').style.color = 'var(--danger)';
    return;
  }
  
  $('remoteJoinStatus').textContent = 'Connecting...';
  $('remoteJoinStatus').style.color = 'var(--text2)';
  
  const channelName = NET_CHANNEL_PREFIX + code;
  
  try {
    netChannel = new BroadcastChannel(channelName);
    netChannel.onmessage = handleNetworkMessage;
    
    // 发送加入请求
    netChannel.postMessage({
      type: 'joinRequest',
      playerName: name,
      playerId: remotePlayerId
    });
    
    // 设置超时
    setTimeout(()=>{
      if(roomPlayers.length <= 1 && isHost === false){
        // 如果没有收到主机的响应，尝试自己创建房间
        console.log('[MathPK] No host response, trying to create room...');
        roomCode = code;
        isHost = true;
        roomPlayers = [{name:name, score:0, lv:1, correct:0, wrong:0, _lastCorrect:true}];
        $('roomCodeBox').style.display = 'block';
        $('createSection').style.display = 'none';
        $('joinSection').style.display = 'block';
        $('remoteJoinSection').style.display = 'none';
        $('roomCode').textContent = code;
        $('roomCode').onclick = ()=>{navigator.clipboard?.writeText(code);$('roomCode').style.opacity='.5';setTimeout(()=>$('roomCode').style.opacity='1',300)};
        renderSlots();
        showNetworkStatus('No host found - created new room', 'online');
        setupHostRoom(code);
      }
    }, 3000);
    
    showNetworkStatus('Joining room ' + code + ' as ' + name + '...', 'online');
    
  } catch(e) {
    $('remoteJoinStatus').textContent = 'Failed to connect: ' + e.message;
    $('remoteJoinStatus').style.color = 'var(--danger)';
    console.error('[MathPK] Join error:', e);
  }
}

/** 广播消息到房间所有成员 */
function broadcastToRoom(msg){
  if(!netChannel || !isHost) return;
  try {
    netChannel.postMessage(msg);
  } catch(e) {
    console.warn('[MathPK] Broadcast failed:', e);
  }
}

/** 处理接收到的网络消息 */
function handleNetworkMessage(event){
  const data = event.data;
  if(!data || !data.type) return;
  
  console.log('[MathPK] Received message:', data.type, data);
  
  switch(data.type){
    case 'joinRequest':
      // 主机收到加入请求
      if(isHost){
        const name = data.playerName;
        if(roomPlayers.length >= MAX_PLAYERS){
          netChannel.postMessage({type:'joinDenied', reason:'Room is full'});
          return;
        }
        if(roomPlayers.some(p=>p.name===name)){
          netChannel.postMessage({type:'joinDenied', reason:'Name already taken'});
          return;
        }
        roomPlayers.push({name:name, score:0, lv:1, correct:0, wrong:0, _lastCorrect:true});
        renderSlots();
        
        // 发送确认给加入者
        netChannel.postMessage({
          type: 'joinAccepted',
          players: roomPlayers.map(p=>({name:p.name, score:p.score, lv:p.lv, correct:p.correct, wrong:p.wrong}))
        });
        
        // 广播给其他已连接的客户端
        broadcastToRoom({type:'playerJoined', player:{name:name, score:0, lv:1, correct:0, wrong:0}});
        
        $('remoteJoinStatus').textContent = name + ' joined!';
        $('remoteJoinStatus').style.color = 'var(--accent2)';
      }
      break;
      
    case 'joinAccepted':
      // 加入者收到主机确认
      if(!isHost){
        roomPlayers = data.players;
        $('roomCodeBox').style.display = 'block';
        $('createSection').style.display = 'none';
        $('joinSection').style.display = 'none';
        $('remoteJoinSection').style.display = 'none';
        $('roomCode').textContent = roomCode;
        $('roomCode').onclick = ()=>{navigator.clipboard?.writeText(roomCode);$('roomCode').style.opacity='.5';setTimeout(()=>$('roomCode').style.opacity='1',300)};
        renderSlots();
        showNetworkStatus('Joined room as ' + roomPlayers[roomPlayers.length-1].name, 'online');
        
        // 显示开始按钮(如果有2个以上玩家)
        if(roomPlayers.length >= 2){
          $('startSection').style.display = 'block';
        }
      }
      break;
      
    case 'joinDenied':
      $('remoteJoinStatus').textContent = 'Join denied: ' + data.reason;
      $('remoteJoinStatus').style.color = 'var(--danger)';
      showNetworkStatus('Failed to join: ' + data.reason, 'offline');
      break;
      
    case 'playerJoined':
      // 其他客户端收到新玩家加入通知
      if(isHost) return; // 主机自己处理
      roomPlayers.push(data.player);
      renderSlots();
      showNetworkStatus(data.player.name + ' joined the room!', 'online');
      break;
      
    case 'startGame':
      // 主机开始游戏 - 通知所有客户端
      if(!isHost){
        mode = 'duel';
        players = roomPlayers.map(p=>({name:p.name, score:p.score, lv:p.lv, correct:p.correct, wrong:p.wrong, _lastCorrect:true}));
        turn = 0; qCount = 0;
        show('gameScreen');
        $('modeTag').textContent = players.length + '-Player PK (Online)';
        renderScoreboards();
        // 客户端等待主机发送第一题(newQuestion消息)
        showNetworkStatus('Waiting for host to send question...', 'online');
        startBGM();
      }
      break;
      
    case 'newQuestion':
      // 主机发送新题目给客户端
      if(!isHost){
        answered = false;
        $('submitBtn').style.display = '';
        $('nextBtn').style.display = 'none';
        $('feedback').className = 'fb';
        $('feedback').textContent = '';
        $('answerInput').value = '';
        $('answerInput').disabled = false;
        $('answerInput').focus();
        
        currentQ = data.question;
        turn = data.turn;
        qCount = data.qCount;
        
        // 更新本地players状态以匹配主机
        if(data.players){
          data.players.forEach((sp, i) => {
            const idx = players.findIndex(p=>p.name===sp.name);
            if(idx !== -1){
              players[idx].score = sp.score;
              players[idx].lv = sp.lv;
              players[idx].correct = sp.correct;
              players[idx].wrong = sp.wrong;
            }
          });
        }
        
        $('qText').textContent = currentQ.text;
        
        const tags = $('tags');
        tags.innerHTML = '';
        const typeClass = currentQ.type === 'Arithmetic' ? 'tag-arithmetic' : currentQ.type === 'Algebra' ? 'tag-algebra' : 'tag-word';
        tags.innerHTML = '<span class="tag ' + typeClass + '">' + currentQ.type + '</span><span class="tag tag-diff">Lv ' + currentQ.lv + '</span>';
        
        renderScoreboards();
      }
      break;
      
    case 'submitAnswer':
      // 客户端提交答案给主机 - 主机处理并广播结果
      if(isHost){
        const playerIdx = roomPlayers.findIndex(p=>p.name===data.playerName);
        if(playerIdx === -1) return;
        
        // 找到对应玩家
        const p = players[playerIdx];
        if(!p) return;
        
        const val = parseInput(data.answer);
        if(isNaN(val)) return;
        
        const correct = Math.abs(val - data.questionAnswer) < 0.01;
        
        if(correct){
          p.score += 10 * p.lv;
          p.correct++;
          p._lastCorrect = true;
        } else {
          p.wrong++;
          p._lastCorrect = false;
        }
        
        qCount++;
        
        // 广播答案结果给所有客户端
        broadcastToRoom({
          type: 'answerResult',
          playerName: data.playerName,
          correct: correct,
          answer: data.questionAnswer,
          qCount: qCount,
          turn: turn,
          players: roomPlayers.map(p=>({name:p.name, score:p.score, lv:p.lv, correct:p.correct, wrong:p.wrong}))
        });
        
        // 检查游戏是否结束
        const total = TOTAL_Q * players.length;
        if(qCount >= total){
          // 游戏结束 - 广播结果
          broadcastToRoom({type:'gameOver', results: roomPlayers.map(p=>({name:p.name, score:p.score, lv:p.lv, correct:p.correct, wrong:p.wrong}))});
          setTimeout(()=>{showResult();}, 1500);
          return;
        }
        
        // 轮到下一个玩家
        turn = (turn + 1) % players.length;
        
        // 主机出题并广播给客户端
        nextQuestion();
      }
      break;
      
    case 'answerResult':
      // 客户端收到答案结果
      if(!isHost){
        answered = true;
        $('answerInput').disabled = true;
        
        const fb = $('feedback');
        if(data.correct){
          fb.className = 'fb show correct';
          fb.innerHTML = 'Correct! (+10)';
          sfxCorrect();
        } else {
          fb.className = 'fb show wrong';
          fb.innerHTML = 'Wrong! Answer: ' + fmt(data.answer);
          sfxWrong();
        }
        
        $('submitBtn').style.display = 'none';
        $('nextBtn').style.display = '';
        
        // 更新本地分数
        const playerIdx = players.findIndex(p=>p.name===data.playerName);
        if(playerIdx !== -1){
          players[playerIdx].score = data.players[playerIdx]?.score || players[playerIdx].score;
          players[playerIdx].correct = data.players[playerIdx]?.correct || players[playerIdx].correct;
          players[playerIdx].wrong = data.players[playerIdx]?.wrong || players[playerIdx].wrong;
          players[playerIdx].lv = data.players[playerIdx]?.lv || players[playerIdx].lv;
        }
        
        renderScoreboards();
        
        // 检查游戏是否结束
        const total = TOTAL_Q * players.length;
        if(data.qCount >= total){
          setTimeout(showResult, 1400);
        } else {
          // 客户端等待主机发送下一题，不主动调用nextQuestion
          $('feedback').textContent = 'Waiting for next question...';
          $('feedback').className = 'fb show';
        }
      }
      break;
      
    case 'nextQuestion':
      // 主机请求下一题 - 客户端不需要做任何事，等待newQuestion即可
      break;
      
    case 'gameOver':
      // 游戏结束
      if(!isHost){
        stopBGM();
        show('resultScreen');
        const rc = $('resultCard');
        let html = '<h2>Game Over</h2>';
        
        const sorted = data.results.sort((a,b)=>b.score-a.score||b.correct-a.correct);
        const maxScore = sorted[0].score;
        const winners = sorted.filter(p=>p.score===maxScore);
        const tie = winners.length > 1;
        
        html += '<div class="winner">' + (tie ? "It's a Tie!" : '🏆 ' + sorted[0].name + ' Wins!') + '</div>';
        
        html += '<table class="ranking-table"><thead><tr>';
        html += '<th class="rank-badge">Rank</th>';
        html += '<th>Player</th>';
        html += '<th>Score</th>';
        html += '<th>Lv</th>';
        html += '<th>✅</th>';
        html += '<th>❌</th>';
        html += '</tr></thead><tbody>';
        
        sorted.forEach((p,i)=>{
          const isWinner = p.score === maxScore;
          html += '<tr' + (isWinner ? ' style="color:var(--warn)"' : '') + '>';
          html += '<td class="rank-badge">' + (i===0?'🥇':i===1?'🥈':i===2?'🥉':('#'+(i+1))) + '</td>';
          html += '<td>' + p.name + '</td>';
          html += '<td>' + p.score + '</td>';
          html += '<td>' + p.lv + '</td>';
          html += '<td>' + p.correct + '</td>';
          html += '<td>' + p.wrong + '</td>';
          html += '</tr>';
        });
        
        html += '</tbody></table>';
        html += '<div class="actions"><button class="btn btn-primary" onclick="goMenu()">Back to Menu</button><button class="btn btn-secondary" onclick="showRoomScreen()">Play Again</button></div>';
        
        rc.innerHTML = html;
      }
      break;
      
    case 'hostLeft':
      // 主机离开了
      if(!isHost){
        showNetworkStatus('Host left the room', 'offline');
        setTimeout(goMenu, 2000);
      }
      break;
  }
}

/** 显示网络状态 */
function showNetworkStatus(text, status){
  const el = $('networkStatus');
  const textEl = $('networkStatusText');
  textEl.textContent = text;
  textEl.className = status === 'online' ? 'network-badge online' : 'network-badge offline';
  el.style.display = 'block';
  setTimeout(()=>{el.style.display='none'}, 5000);
}

function startSolo(){
  sfxClick();mode='solo';
  players=[{name:'You',score:0,lv:1,correct:0,wrong:0,_lastCorrect:true}];
  turn=0;qCount=0;
  show('gameScreen');$('modeTag').textContent='Solo Mode · Adaptive Difficulty';
  renderScoreboards();nextQuestion();startBGM();
}

/* ========== Room ========== */
function genCode(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<6;i++)s+=c[rand(0,c.length-1)];return s}

function createRoom(){
  sfxClick();sfxJoin();
  const name=$('p1Input').value.trim()||'Player 1';
  roomCode=genCode();
  $('roomCode').textContent=roomCode;
  
  // 创建者加入房间
  roomPlayers=[{name:name,score:0,lv:1,correct:0,wrong:0,_lastCorrect:true}];
  
  $('roomCodeBox').style.display='block';
  $('createSection').style.display='none';
  $('joinSection').style.display='block';
  
  // 复制房间号
  $('roomCode').onclick=()=>{navigator.clipboard?.writeText(roomCode);sfxCopy();$('roomCode').style.opacity='.5';setTimeout(()=>$('roomCode').style.opacity='1',300)};
  
  renderSlots();
  // 清空加入表单
  $('joinNameInput').value='';
  
  // ===== 设置网络主机 =====
  setupHostRoom(roomCode);
}

function joinRoom(){
  sfxClick();sfxJoin();
  const name=$('joinNameInput').value.trim()||'Player '+(roomPlayers.length+1);
  
  if(roomPlayers.length>=MAX_PLAYERS){
    alert('Room is full! Maximum '+MAX_PLAYERS+' players.');
    return;
  }
  
  // 检查名字重复
  if(roomPlayers.some(p=>p.name===name)){
    alert('Name already taken! Please choose another name.');
    return;
  }
  
  roomPlayers.push({name:name,score:0,lv:1,correct:0,wrong:0,_lastCorrect:true});
  $('joinNameInput').value='';
  
  renderSlots();
  
  // 显示已加入玩家列表
  const list=$('joinedPlayersList');
  list.innerHTML='<div style="font-size:.85rem;color:var(--text2);margin-bottom:6px">Joined Players:</div>'+
    roomPlayers.map((p,i)=>`<div style="margin:4px 0">${i+1}. ${p.name}</div>`).join('');
}

function startDuel(){
  sfxClick();sfxGameStart();mode='duel';
  // 使用所有房间中的玩家 (不再限制2人)
  players=roomPlayers.map(p=>({name:p.name,score:0,lv:1,correct:0,wrong:0,_lastCorrect:true}));
  turn=0;qCount=0;
  
  // ===== 网络广播: 开始游戏 =====
  broadcastToRoom({type:'startGame'});
  
  if(isHost){
    show('gameScreen');
    $('modeTag').textContent=players.length+'-Player PK (Online)';
    renderScoreboards();
    // 主机出题并广播给客户端
    nextQuestion(); // 这会自动广播题目
    startBGM();
  } else {
    // 客户端等待主机发送题目
    showNetworkStatus('Waiting for host to start...', 'online');
  }
}

/* ========== Game Logic ========== */
function renderScoreboards(){
  const sb=$('scoreboards');sb.innerHTML='';
  players.forEach((p,i)=>{
    const d=document.createElement('div');
    d.className='sb'+(mode==='duel'&&i===turn?' active-turn':'');
    d.innerHTML=`<div class="sb-name">${p.name}</div><div class="sb-score">${p.score}</div><div class="sb-lv">Lv ${p.lv}</div>`;
    sb.appendChild(d);
  });
  // 多人模式总题数 = 每个玩家各答 TOTAL_Q 题
  const total=mode==='solo'?TOTAL_Q:TOTAL_Q*players.length;
  $('progressFill').style.width=(qCount/total*100)+'%';
  $('progressText').textContent=`Question ${qCount} / ${total}`;
  $('turnLabel').textContent=mode==='duel'?`${players[turn].name}'s Turn`:'';
}

function nextQuestion(){
  answered=false;
  $('submitBtn').style.display='';$('nextBtn').style.display='none';
  $('feedback').className='fb';
  $('answerInput').value='';$('answerInput').disabled=false;$('answerInput').focus();

  const p=players[turn];

  // Adaptive: correct → lv+1, wrong → lv-1
  if(qCount>0){
    const prev=p._lastCorrect;
    const oldLv=p.lv;
    if(prev)p.lv=Math.min(p.lv+1,10);
    else p.lv=Math.max(p.lv-1,1);
    if(p.lv>oldLv)sfxLevelUp();
    else if(p.lv<oldLv)sfxLevelDown();
  }

  currentQ=genQuestion(p.lv);
  $('qText').textContent=currentQ.text;

  const tags=$('tags');tags.innerHTML='';
  const typeClass=currentQ.type==='Arithmetic'?'tag-arithmetic':currentQ.type==='Algebra'?'tag-algebra':'tag-word';
  tags.innerHTML=`<span class="tag ${typeClass}">${currentQ.type}</span><span class="tag tag-diff">Lv ${p.lv}</span>`;

  renderScoreboards();
  
  // ===== 网络广播: 新题目 =====
  if(isHost && netChannel){
    broadcastToRoom({
      type: 'newQuestion',
      question: currentQ,
      turn: turn,
      qCount: qCount
    });
  }
}

function submitAnswer(){
  if(answered)return;
  const raw=$('answerInput').value;
  const val=parseInput(raw);
  if(isNaN(val)){$('answerInput').focus();return}
  
  // ===== 客户端(非主机): 发送答案到主机 =====
  if(!isHost && netChannel){
    netChannel.postMessage({
      type: 'submitAnswer',
      playerName: players[turn]?.name || 'Unknown',
      answer: raw,
      questionAnswer: currentQ?.answer
    });
    $('answerInput').disabled=true;
    $('submitBtn').style.display='none';
    $('nextBtn').style.display='';
    $('feedback').className='fb show';
    $('feedback').textContent='Answer sent...';
    return;
  }
  
  answered=true;
  $('answerInput').disabled=true;
  $('submitBtn').style.display='none';$('nextBtn').style.display='';

  const p=players[turn];
  const correct=Math.abs(val-currentQ.answer)<0.01;
  const fb=$('feedback');

  if(correct){
    p.score+=10*p.lv;p.correct++;p._lastCorrect=true;
    const nextLv=Math.min(p.lv+1,10);
    fb.className='fb show correct';
    fb.innerHTML=`Correct! &nbsp; Lv ${p.lv} → ${nextLv} &nbsp; (+${10*p.lv})`;
    sfxCorrect();
  }else{
    p.wrong++;p._lastCorrect=false;
    const nextLv=Math.max(p.lv-1,1);
    fb.className='fb show wrong';
    fb.innerHTML=`Wrong! &nbsp; Answer: ${fmt(currentQ.answer)}<br>Lv ${p.lv} → ${nextLv}`;
    sfxWrong();
  }

  qCount++;renderScoreboards();

  // ===== 网络广播: 提交答案 =====
  if(isHost && netChannel){
    // 主机处理答案并广播给客户端
    broadcastToRoom({
      type: 'answerResult',
      playerName: p.name,
      correct: correct,
      answer: currentQ.answer,
      qCount: qCount,
      turn: turn,
      players: roomPlayers.map(pp=>({name:pp.name, score:pp.score, lv:pp.lv, correct:pp.correct, wrong:pp.wrong}))
    });
  }

  // 多人模式总题数 = 每个玩家各答 TOTAL_Q 题
  const total=mode==='solo'?TOTAL_Q:TOTAL_Q*players.length;
  if(qCount>=total){
    // ===== 网络广播: 游戏结束 =====
    if(isHost && netChannel){
      broadcastToRoom({type:'gameOver', results: roomPlayers.map(p=>({name:p.name, score:p.score, lv:p.lv, correct:p.correct, wrong:p.wrong}))});
    }
    setTimeout(showResult,1400);
    return;
  }
  if(mode==='duel')turn=(turn+1)%players.length;
  
  // ===== 网络广播: 下一题 =====
  if(isHost && netChannel && !answered){
    broadcastToRoom({type:'nextQuestion'});
  }
}

document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&$('gameScreen').classList.contains('active')){
    if(!answered)submitAnswer();
    else if($('nextBtn').style.display!=='none')nextQuestion();
  }
});

/* ========== Result (增强版 - 显示排名) ========== */
function showResult(){
  stopBGM();show('resultScreen');
  const rc=$('resultCard');let html='<h2>🏁 Game Over</h2>';

  if(mode==='solo'){
    const p=players[0];
    const acc=p.correct+p.wrong?Math.round(p.correct/(p.correct+p.wrong)*100):0;
    html+=`<div class="winner">Great job, ${p.name}!</div>`;
    html+=`<div class="final-scores"><div class="final-sb winner-box"><div class="fs-rank">#1</div><div class="fs-name">${p.name}</div><div class="fs-score">${p.score}</div></div></div>`;
    html+=`<div class="detail">✅ ${p.correct} &nbsp; ❌ ${p.wrong} &nbsp; Accuracy: ${acc}%<br>Final Level: ${p.lv}</div>`;
  }else{
    // 排序排名
    const sorted=[...players].sort((a,b)=>b.score-a.score||b.correct-a.correct);
    const maxScore=sorted[0].score;
    const winners=sorted.filter(p=>p.score===maxScore);
    const tie=winners.length>1;
    
    html+=`<div class="winner">${tie?"It's a Tie! 🤝":'🏆 '+sorted[0].name+' Wins!'}</div>`;
    
    // 排名表格
    html+='<table class="ranking-table"><thead><tr>';
    html+='<th class="rank-badge">Rank</th>';
    html+='<th>Player</th>';
    html+='<th>Score</th>';
    html+='<th>Lv</th>';
    html+='<th>✅</th>';
    html+='<th>❌</th>';
    html+='</tr></thead><tbody>';
    
    // 奖牌符号
    const medals=['🥇','🥈','🥉'];
    
    sorted.forEach((p,i)=>{
      const isWinner=p.score===maxScore;
      html+='<tr'+(isWinner?' style="color:var(--warn)"':'')+'>';
      html+=`<td class="rank-badge">${i===0?'🥇':i===1?'🥈':i===2?'🥉':('#'+(i+1))}</td>`;
      html+=`<td>${p.name}</td>`;
      html+=`<td>${p.score}</td>`;
      html+=`<td>${p.lv}</td>`;
      html+=`<td>${p.correct}</td>`;
      html+=`<td>${p.wrong}</td>`;
      html+='</tr>';
    });
    
    html+='</tbody></table>';
    
    // 详细统计
    html+='<div class="detail">';
    players.forEach(p=>{html+=`${p.name}: ✅${p.correct} ❌${p.wrong} Lv${p.lv} &nbsp; `});
    html+='</div>';
  }

  // 播放结果音效
  if(mode==='solo'){
    const p=players[0];
    if(p.score > TOTAL_Q*5) sfxVictory();
    else if(p.score < TOTAL_Q*2) sfxDefeat();
  }else{
    const sorted=[...players].sort((a,b)=>b.score-a.score||b.correct-a.correct);
    if(sorted[0].score > TOTAL_Q*players.length*3) sfxVictory();
    else sfxDefeat();
  }
  
  html+=`<div class="actions"><button class="btn btn-primary" onclick="goMenu()">Back to Menu</button><button class="btn btn-secondary" onclick="showRoomScreen()">Play Again</button></div>`;
  rc.innerHTML=html;
}

// 生成浮动粒子
(function(){
  const container=document.getElementById('particles');
  if(!container)return;
  const count=30;
  for(let i=0;i<count;i++){
    const p=document.createElement('div');
    p.className='particle';
    p.style.left=Math.random()*100+'%';
    p.style.animationDuration=(Math.random()*15+10)+'s';
    p.style.animationDelay=(Math.random()*15)+'s';
    p.style.width=p.style.height=(Math.random()*3+1)+'px';
    container.appendChild(p);
  }
})();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Math PK Arena</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a1a;--bg2:#1a1a3e;--bg3:#0f0c29;
  --card:rgba(255,255,255,.07);--card-border:rgba(255,255,255,.12);
  --card-border-hover:rgba(255,255,255,.25);
  --accent:#7f5af0;--accent2:#2cb67d;--accent3:#f9c74f;--danger:#e53170;--warn:#f9c74f;
  --text:#fffffe;--text2:#94a1b2;--text3:#6b7280;
  --radius:20px;--shadow:0 8px 32px rgba(0,0,0,.4);
}
body{
  font-family:'Segoe UI',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;
  display:flex;justify-content:center;align-items:center;position:relative;
  background:linear-gradient(135deg,#070718,#0f0c29,#121230);
  background-size:200% 200%;
  animation:bgShift 15s ease infinite;
}
@keyframes bgShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

/* 暗角遮罩 */
.bg-vignette{
  position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;
  background:radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,.45) 100%);
  pointer-events:none;
}

/* 动态渐变背景球 */
.bg-orbs{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-2;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.3;animation:floatOrb 25s infinite ease-in-out}
.orb:nth-child(1){width:450px;height:450px;background:radial-gradient(circle,var(--accent),transparent 70%);top:-15%;left:-10%;animation-delay:0s}
.orb:nth-child(2){width:400px;height:400px;background:radial-gradient(circle,var(--accent2),transparent 70%);top:45%;right:-12%;animation-delay:-6s}
.orb:nth-child(3){width:350px;height:350px;background:radial-gradient(circle,#f9c74f30,transparent 70%);bottom:-10%;left:25%;animation-delay:-12s}
.orb:nth-child(4){width:300px;height:300px;background:radial-gradient(circle,#e5317040,transparent 70%);top:25%;left:55%;animation-delay:-18s}
.orb:nth-child(5){width:380px;height:380px;background:radial-gradient(circle,#4fc3f730,transparent 70%);top:60%;left:5%;animation-delay:-9s}
.orb:nth-child(6){width:280px;height:280px;background:radial-gradient(circle,#b388ff30,transparent 70%);top:10%;right:20%;animation-delay:-3s}
@keyframes floatOrb{
  0%,100%{transform:translate(0,0) scale(1)}
  25%{transform:translate(60px,-40px) scale(1.12)}
  50%{transform:translate(-40px,70px) scale(.93)}
  75%{transform:translate(70px,40px) scale(1.06)}
}

/* 点阵网格背景 */
.bg-grid{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;
  background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:40px 40px;pointer-events:none;
  mask-image:radial-gradient(ellipse at center, black 50%, transparent 100%);
  -webkit-mask-image:radial-gradient(ellipse at center, black 50%, transparent 100%);
}

/* 浮动粒子 */
.particles{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;pointer-events:none;overflow:hidden}
.particle{position:absolute;width:3px;height:3px;background:rgba(255,255,255,.3);border-radius:50%;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(100vh) translateX(0) scale(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(-10vh) translateX(100px) scale(1);opacity:0}}

.screen{display:none;width:100%;max-width:560px;padding:20px;animation:fadeIn .6s cubic-bezier(.22,1,.36,1)}
.screen.active{display:flex;flex-direction:column;align-items:center;gap:24px}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}

@keyframes shakeX{0%,100%{transform:translateX(0)}15%,45%,75%{transform:translateX(-6px)}30%,60%,90%{transform:translateX(6px)}}
@keyframes scaleIn{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes gradientShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}

h1{
  font-size:2.4rem;font-weight:900;
  background:linear-gradient(135deg,#7f5af0,#2cb67d,#f9c74f,#ff7eb9,#7f5af0);
  background-size:400% 400%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  text-align:center;line-height:1.2;animation:gradientShift 6s ease infinite,float 4s ease-in-out infinite;
  letter-spacing:.5px;
}
h2{font-size:1.6rem;text-align:center;animation:slideUp .5s ease;font-weight:800}
.subtitle{color:var(--text2);font-size:.95rem;text-align:center;margin-top:-6px;animation:slideUp .5s ease .1s both;letter-spacing:.3px}

/* 玻璃拟态卡片 */
.card{
  background:var(--card);border:1px solid var(--card-border);
  border-radius:var(--radius);padding:32px;width:100%;
  backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  box-shadow:
    0 10px 40px rgba(0,0,0,.4),
    inset 0 1px 0 rgba(255,255,255,.08),
    inset 0 -1px 0 rgba(0,0,0,.2);
  transition:all .35s cubic-bezier(.22,1,.36,1);
  position:relative;overflow:hidden;
}
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);
}
.card:hover{
  border-color:var(--card-border-hover);
  box-shadow:
    0 14px 50px rgba(0,0,0,.45),
    inset 0 1px 0 rgba(255,255,255,.1);
  transform:translateY(-2px);
}

/* 按钮 */
.btn{
  border:none;border-radius:14px;padding:16px 30px;font-size:1rem;font-weight:700;
  cursor:pointer;transition:all .3s cubic-bezier(.22,1,.36,1);width:100%;letter-spacing:.5px;
  position:relative;overflow:hidden;
}
.btn::after{
  content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent);
  transition:left .6s;
}
.btn:hover::after{left:100%}
.btn-primary{
  background:linear-gradient(135deg,var(--accent),#6b4fe0);
  color:#fff;
  box-shadow:0 4px 18px rgba(0,0,0,.3);
}
.btn-primary:hover{
  transform:translateY(-4px) scale(1.02);
  box-shadow:0 8px 30px rgba(0,0,0,.35);
}
.btn-primary:active{transform:translateY(-1px) scale(.98)}
.btn-secondary{
  background:rgba(255,255,255,.08);color:var(--text);
  border:1px solid var(--card-border);
  backdrop-filter:blur(10px);
}
.btn-secondary:hover{
  background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.25);
  transform:translateY(-3px);
  box-shadow:0 6px 20px rgba(0,0,0,.25);
}
.btn-secondary:active{transform:translateY(0) scale(.98)}

/* 输入框 */
input[type=text]{
  width:100%;padding:16px 20px;border-radius:14px;
  border:1px solid var(--card-border);
  background:rgba(255,255,255,.05);
  color:#fff;font-size:1.15rem;outline:none;
  transition:all .3s cubic-bezier(.22,1,.36,1);
  text-align:center;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.15);
  inputmode:text;
  letter-spacing:.3px;
}
input[type=text]:focus{
  border-color:var(--accent);
  box-shadow:
    0 0 0 4px rgba(127,90,240,.18),
    inset 0 2px 6px rgba(0,0,0,.1);
  background:rgba(255,255,255,.09);
}
input::placeholder{color:var(--text3);font-weight:400}

/* 声音按钮 */
.sound-btn{
  position:fixed;top:20px;right:20px;z-index:99;
  width:50px;height:50px;border-radius:50%;border:1px solid var(--card-border);
  background:var(--card);backdrop-filter:blur(14px);cursor:pointer;
  font-size:1.4rem;display:flex;align-items:center;justify-content:center;
  transition:all .3s cubic-bezier(.22,1,.36,1);
  box-shadow:0 4px 15px rgba(0,0,0,.25);
}
.sound-btn:hover{
  background:rgba(255,255,255,.12);transform:scale(1.12);
  box-shadow:0 6px 22px rgba(0,0,0,.3);
}

/* 品牌标识 */
.brand{
  position:fixed;top:24px;left:24px;z-index:99;
  font-size:.8rem;font-weight:700;
  color:rgba(255,255,255,.4);letter-spacing:1px;user-select:none;
  text-transform:uppercase;
}

/* 游戏区域 */
.q-card{
  text-align:center;padding:40px 32px;
  border:1px solid var(--card-border);
  background:linear-gradient(135deg,rgba(127,90,240,.06),rgba(44,182,125,.06));
}
.q-card.new-q{animation:scaleIn .4s cubic-bezier(.22,1,.36,1)}
.q-text{
  font-size:1.65rem;font-weight:800;line-height:1.6;
  margin:18px 0 28px;word-break:break-word;
  min-height:90px;display:flex;align-items:center;justify-content:center;
  white-space:pre-line;
}

/* 标签 */
.tags{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.tag{
  padding:6px 16px;border-radius:20px;font-size:.78rem;font-weight:700;letter-spacing:.5px;
  backdrop-filter:blur(8px);
}
.tag-arithmetic{background:linear-gradient(135deg,rgba(127,90,240,.25),rgba(127,90,240,.1));color:#b4a0ff;border:1px solid rgba(127,90,240,.25)}
.tag-algebra{background:linear-gradient(135deg,rgba(44,182,125,.25),rgba(44,182,125,.1));color:#6ee7b7;border:1px solid rgba(44,182,125,.25)}
.tag-frac{background:linear-gradient(135deg,rgba(255,100,150,.25),rgba(255,100,150,.1));color:#ff94b8;border:1px solid rgba(255,100,150,.25)}
.tag-percent{background:linear-gradient(135deg,rgba(255,160,80,.25),rgba(255,160,80,.1));color:#ffc080;border:1px solid rgba(255,160,80,.25)}
.tag-geo{background:linear-gradient(135deg,rgba(120,180,255,.25),rgba(120,180,255,.1));color:#90c8ff;border:1px solid rgba(120,180,255,.25)}
.tag-prob{background:linear-gradient(135deg,rgba(180,120,255,.25),rgba(180,120,255,.1));color:#c8a0ff;border:1px solid rgba(180,120,255,.25)}
.tag-trig{background:linear-gradient(135deg,rgba(255,200,100,.25),rgba(255,200,100,.1));color:#ffd880;border:1px solid rgba(255,200,100,.25)}
.tag-calc{background:linear-gradient(135deg,rgba(255,120,180,.25),rgba(255,120,180,.1));color:#ff9cc4;border:1px solid rgba(255,120,180,.25)}
.tag-diff{background:rgba(255,255,255,.08);color:var(--text2);border:1px solid rgba(255,255,255,.12)}

/* 反馈 */
.fb{
  margin-top:16px;padding:16px 20px;border-radius:14px;
  font-weight:700;text-align:center;font-size:1rem;
  opacity:0;transition:all .35s cubic-bezier(.22,1,.36,1);
  transform:translateY(8px) scale(.98);
}
.fb.show{opacity:1;transform:translateY(0) scale(1)}
.fb.correct{
  background:linear-gradient(135deg,rgba(44,182,125,.15),rgba(44,182,125,.08));
  color:#6ee7b7;border:1px solid rgba(44,182,125,.3);
}
.fb.wrong{
  background:linear-gradient(135deg,rgba(229,49,112,.15),rgba(229,49,112,.08));
  color:#ff8fab;border:1px solid rgba(229,49,112,.3);
  animation:shakeX .55s cubic-bezier(.36,.07,.19,.97);
}

/* 计分板 */
.scoreboards{display:flex;gap:14px;width:100%;flex-wrap:wrap;justify-content:center}
.sb{
  flex:1 1 120px;min-width:120px;max-width:180px;
  background:var(--card);border:1px solid var(--card-border);
  border-radius:16px;padding:16px;text-align:center;
  transition:all .35s cubic-bezier(.22,1,.36,1);
  backdrop-filter:blur(10px);
  box-shadow:0 4px 15px rgba(0,0,0,.2);
}
.sb:hover{
  transform:translateY(-3px);
  box-shadow:0 8px 25px rgba(0,0,0,.3);
  border-color:rgba(255,255,255,.2);
}
.sb-name{font-size:.85rem;color:var(--text2);margin-bottom:8px;font-weight:500}
.sb-score{
  font-size:2rem;font-weight:900;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  line-height:1;
}
.sb-lv{font-size:.75rem;color:var(--accent);margin-top:6px;font-weight:700;letter-spacing:.5px}

/* 进度条 */
.progress-bar{
  width:100%;height:10px;background:rgba(255,255,255,.06);
  border-radius:6px;overflow:hidden;position:relative;
  box-shadow:inset 0 2px 4px rgba(0,0,0,.2);
}
.progress-fill{
  height:100%;
  background:linear-gradient(90deg,var(--accent),var(--accent2),var(--accent3));
  background-size:200% 100%;
  border-radius:6px;
  transition:width .6s cubic-bezier(.22,1,.36,1);
  position:relative;
  animation:gradientShift 3s linear infinite;
}
.progress-fill::after{
  content:'';position:absolute;top:0;left:0;right:0;bottom:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);
  animation:shimmer 2.5s infinite;
}
.progress-text{font-size:.8rem;color:var(--text2);text-align:center;margin-top:8px;font-weight:500}

/* 结果页面 */
.winner{
  font-size:1.6rem;font-weight:900;text-align:center;
  margin:12px 0;
  background:linear-gradient(135deg,#f9c74f,#f9844a,#ffd880,#f9c74f);
  background-size:300% 300%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  animation:gradientShift 4s ease infinite;
}
.final-scores{display:flex;gap:16px;width:100%;margin:16px 0;flex-wrap:wrap;justify-content:center}
.final-sb{
  flex:1 1 140px;min-width:140px;max-width:200px;
  background:var(--card);border:1px solid var(--card-border);
  border-radius:18px;padding:24px;text-align:center;
  transition:all .35s cubic-bezier(.22,1,.36,1);
  backdrop-filter:blur(10px);
  box-shadow:0 6px 20px rgba(0,0,0,.25);
}
.final-sb:hover{transform:translateY(-5px);box-shadow:0 12px 35px rgba(0,0,0,.35)}
.final-sb.winner-box{
  border-color:var(--warn);
  background:linear-gradient(135deg,rgba(249,199,79,.08),rgba(249,199,79,.03));
}
.fs-rank{font-size:.85rem;color:var(--accent);font-weight:700;margin-bottom:6px;letter-spacing:.5px}
.fs-name{font-size:.9rem;color:var(--text2);font-weight:500}
.fs-score{font-size:2.4rem;font-weight:900;margin-top:8px;line-height:1}
.detail{font-size:.85rem;color:var(--text2);text-align:center;line-height:2}

/* 按钮组 */
.actions{display:flex;gap:14px;width:100%;margin-top:10px}
.actions .btn{flex:1}

/* 67彩蛋特效容器 */
#egg67Container{
  position:fixed;top:0;left:0;width:100vw;height:100vh;
  pointer-events:none;z-index:9999;overflow:hidden;
}
.egg67-text{
  position:absolute;font-weight:900;
  color:#ffdd44;
  user-select:none;
}

/* 响应式 */
@media(max-width:480px){
  h1{font-size:1.9rem}
  .q-text{font-size:1.3rem}
  .card{padding:24px}
  .btn{padding:14px 24px;font-size:.95rem}
  .q-card{padding:32px 24px}
}
</style>
</head>
<body>
<!-- 视觉效果层 -->
<div class="bg-vignette"></div>
<div class="bg-orbs"><div class="orb"></div><div class="orb"></div><div class="orb"></div><div class="orb"></div><div class="orb"></div><div class="orb"></div></div>
<div class="bg-grid"></div>
<div class="particles" id="particles"></div>
<div id="egg67Container"></div>

<button class="sound-btn" id="soundToggle" onclick="toggleSound()">🔇</button>
<div class="brand">Made by AntonDing</div>

<!-- MENU -->
<div class="screen active" id="menuScreen">
  <h1>🧮 Math PK Arena</h1>
  <p class="subtitle">From elementary to high school · Adaptive difficulty · Solo Practice</p>
  <div class="card" style="display:flex;flex-direction:column;gap:14px">
    <button class="btn btn-primary" onclick="startSolo()">🎯 Solo Practice</button>
  </div>
</div>

<!-- GAME -->
<div class="screen" id="gameScreen">
  <div class="scoreboards" id="scoreboards"></div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-text" id="progressText"></div>
  <div class="card q-card">
    <div class="tags" id="tags"></div>
    <div class="q-text" id="qText"></div>
    <input type="text" id="answerInput" placeholder="Your answer…" autocomplete="off" inputmode="text">
    <div class="fb" id="feedback"></div>
    <div style="display:flex;gap:12px;margin-top:20px">
      <button class="btn btn-primary" id="submitBtn" onclick="submitAnswer()">Submit</button>
      <button class="btn btn-secondary" id="nextBtn" onclick="nextQuestion()" style="display:none">Next →</button>
    </div>
  </div>
  <div style="font-size:.75rem;color:var(--text2);text-align:center" id="modeTag"></div>
</div>

<!-- RESULT -->
<div class="screen" id="resultScreen">
  <div class="card" id="resultCard" style="display:flex;flex-direction:column;gap:12px"></div>
</div>

<script>
/* ========== 音频引擎 ========== */
let audioCtx=null, soundOn=false, masterGain=null;
function ensureAudio(){
  if(!audioCtx){
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    masterGain=audioCtx.createGain();
    masterGain.gain.setValueAtTime(0.5,audioCtx.currentTime);
    masterGain.connect(audioCtx.destination);
  }
}
function playTone(freq,dur,type='sine',vol=0.1,delay=0,attack=0.01,release=0.1){
  if(!soundOn)return;ensureAudio();
  const t=audioCtx.currentTime+delay;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0.001,t);
  g.gain.linearRampToValueAtTime(vol,t+attack);
  g.gain.setValueAtTime(vol,t+dur-release);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(masterGain||audioCtx.destination);
  o.start(t);o.stop(t+dur+0.01);
  return{o,g};
}
function playNoise(dur,vol=0.05){
  if(!soundOn)return;ensureAudio();
  const bufferSize=audioCtx.sampleRate*dur;
  const buffer=audioCtx.createBuffer(1,bufferSize,audioCtx.sampleRate);
  const data=buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++) data[i]=Math.random()*2-1;
  const source=audioCtx.createBufferSource();
  source.buffer=buffer;
  const g=audioCtx.createGain();
  const t=audioCtx.currentTime;
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  source.connect(g);g.connect(masterGain||audioCtx.destination);
  source.start(t);source.stop(t+dur);
}
let bgmTimer=null,bgmPlaying=false,bgmIdx=0;
const bgmChords=[
  {root:261.6,third:329.6,fifth:392.0,seventh:493.9},
  {root:220.0,third:261.6,fifth:329.6,seventh:392.0},
  {root:174.6,third:220.0,fifth:261.6,seventh:329.6},
  {root:196.0,third:246.9,fifth:293.7,seventh:349.2},
];
const bgmNoteDur=0.18, bgmInterval=220;
function startBGM(){
  if(bgmPlaying)return;bgmPlaying=true;bgmIdx=0;tickBGM();
}
function tickBGM(){
  if(!bgmPlaying)return;
  const chordIdx=Math.floor(bgmIdx/4)%bgmChords.length;
  const chord=bgmChords[chordIdx];
  const noteInChord=bgmIdx%4;
  const noteFreqs=[chord.root*2,chord.third*2,chord.fifth*2,chord.seventh*2];
  playTone(noteFreqs[noteInChord],bgmNoteDur,'triangle',0.018,0,0.005,0.05);
  if(noteInChord===0){
    playTone(chord.root/2,0.35,'sine',0.04,0,0.02,0.1);
  }
  if(noteInChord===0 && bgmIdx>4){
    playTone(chord.root,0.8,'sine',0.008,0,0.05,0.3);
    playTone(chord.fifth,0.8,'sine',0.005,0,0.05,0.3);
  }
  bgmIdx++;
  bgmTimer=setTimeout(tickBGM,bgmInterval);
}
function stopBGM(){bgmPlaying=false;clearTimeout(bgmTimer)}
function toggleSound(){
  soundOn=!soundOn;
  $('soundToggle').textContent=soundOn?'🔊':'🔇';
  if(soundOn){
    ensureAudio();
    if(audioCtx.state==='suspended')audioCtx.resume();
    startBGM();
    playTone(880,.1,'sine',.05);
  }else{
    stopBGM();
    playTone(440,.15,'sine',.03);
  }
}
function sfxCorrect(){
  playTone(523,.08,'sine',.08,0,0.005,0.02);
  playTone(659,.08,'sine',.06,.06,0.005,0.02);

let players=[],qCount=0;

/* ========== 67特效 ========== */
function trigger67Effect(){
  const container = $('egg67Container');
  for(let i=0;i<100;i++){
    const span = document.createElement("div");
    span.className = "egg67-text";
    span.innerText = "67";
    const size = 32 + Math.random()*80;
    span.style.fontSize = size + "px";
    span.style.left = Math.random()*100 + "vw";
    span.style.top = Math.random()*100 + "vh";
    span.style.transform = `rotate(${Math.random()*360}deg) scale(0)`;
    span.style.opacity = 0;
    container.appendChild(span);

    const delay = i * 15;
    setTimeout(()=>{
      span.style.transition = "all 1.4s cubic-bezier(.22,1,.36,1)";
      span.style.transform = `rotate(${Math.random()*360}deg) scale(1)`;
      span.style.opacity = 1;
    }, delay);
    setTimeout(()=>{
      span.style.opacity = 0;
      span.style.transform = `rotate(${Math.random()*360}deg) scale(1.5) translateY(-30px)`;
    }, 1200 + delay);
    setTimeout(()=>span.remove(), 2800 + delay);
  }
}

/* ========== 页面切换 ========== */
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $(id).classList.add('active');
  if(soundOn) sfxScreenTransition();
}
function goMenu(){stopBGM();show('menuScreen')}

/* ========== 单人模式 ========== */
function startSolo(){
  sfxClick();
  players=[{name:'You',score:0,lv:1,correct:0,wrong:0,_lastCorrect:true}];
  qCount=0;
  show('gameScreen');
  $('modeTag').textContent='Solo Mode · Adaptive Difficulty';
  renderScoreboards();
  nextQuestion();
  startBGM();
}

/* ========== 游戏逻辑 ========== */
function renderScoreboards(){
  const sb=$('scoreboards');sb.innerHTML='';
  players.forEach((p)=>{
    const d=document.createElement('div');
    d.className='sb';
    d.innerHTML=`<div class="sb-name">${p.name}</div><div class="sb-score">${p.score}</div><div class="sb-lv">Lv ${p.lv}</div>`;
    sb.appendChild(d);
  });
  $('progressFill').style.width=(qCount/TOTAL_Q*100)+'%';
  $('progressText').textContent=`Question ${qCount} / ${TOTAL_Q}`;
}

function nextQuestion(){
  answered=false;
  $('submitBtn').style.display='';$('nextBtn').style.display='none';
  $('feedback').className='fb';
  $('answerInput').value='';$('answerInput').disabled=false;$('answerInput').focus();
  const p=players[0];
  if(qCount>0){
    const prev=p._lastCorrect;
    const oldLv=p.lv;
    if(prev)p.lv=Math.min(p.lv+1,MAX_LEVEL);
    else p.lv=Math.max(p.lv-1,1);
    if(p.lv>oldLv)sfxLevelUp();
    else if(p.lv<oldLv)sfxLevelDown();
  }
  const pool = allBanks[p.lv-1];
  currentQ = pick(pool);
  $('qText').textContent = currentQ.q;
  const tags=$('tags');tags.innerHTML='';
  const typeMap = {
    "Arithmetic":"tag-arithmetic",
    "Algebra":"tag-algebra",
    "Fraction":"tag-frac",
    "Percent":"tag-percent",
    "Ratio":"tag-percent",
    "Geometry":"tag-geo",
    "Probability":"tag-prob",
    "Sequence":"tag-algebra",
    "Trigonometry":"tag-trig",
    "Logarithm":"tag-algebra",
    "Calculus":"tag-calc",
    "Combinatorics":"tag-prob",
    "Statistics":"tag-geo"
  };
  const tagClass = typeMap[currentQ.type] || "tag-diff";
  tags.innerHTML=`<span class="tag ${tagClass}">${currentQ.type}</span><span class="tag tag-diff">Lv ${p.lv}</span>`;
  renderScoreboards();
}

function submitAnswer(){
  if(answered)return;
  const userStr = $('answerInput').value.trim();

  // 禁止空提交
  if(userStr === ""){
    const fb=$('feedback');
    fb.className = "fb show wrong";
    fb.textContent = "⚠️ Please enter an answer";
    $('answerInput').focus();
    return;
  }

  // Anton彩蛋
  if(userStr === EGG_ANTON){
    answered=true;
    $('answerInput').disabled=true;
    $('submitBtn').style.display='none';$('nextBtn').style.display='';
    const p=players[0];
    p.score+=10*p.lv;p.correct++;p._lastCorrect=true;
    const fb=$('feedback');
    fb.className='fb show correct';
    fb.innerHTML = `Correct,very objective and obviously! (+${10*p.lv})`;
    sfxCorrect();
    qCount++;
    renderScoreboards();
    if(qCount>=TOTAL_Q){setTimeout(showResult,1400);return;}
    return;
  }

  // Raisin彩蛋
  if(userStr === EGG_RAISIN){
    answered=true;
    $('answerInput').disabled=true;
    $('submitBtn').style.display='none';$('nextBtn').style.display='';
    const p=players[0];
    p.score+=10*p.lv;p.correct++;p._lastCorrect=true;
    const fb=$('feedback');
    fb.className='fb show correct';
    fb.innerHTML = `You are so right! (+${10*p.lv})`;
    sfxCorrect();
    qCount++;
    renderScoreboards();
    if(qCount>=TOTAL_Q){setTimeout(showResult,1400);return;}
    return;
  }

  // 67彩蛋
  if(userStr === EGG_67){
    answered=true;
    trigger67Effect();
    $('answerInput').disabled=true;
    $('submitBtn').style.display='none';$('nextBtn').style.display='';
    const p=players[0];
    p.wrong++;p._lastCorrect=false;
    const fb=$('feedback');
    fb.className='fb show wrong';
    fb.innerHTML = `Wrong! Answer: ${fmt(currentQ.a)}`;
    sfxWrong();
    qCount++;
    renderScoreboards();
    if(qCount>=TOTAL_Q){setTimeout(showResult,1400);return;}
    return;
  }

  // 正常数字判分
  const val = parseFloat(userStr);
  if(isNaN(val)){
    const fb=$('feedback');
    fb.className = "fb show wrong";
    fb.textContent = "❌ Invalid answer";
    $('answerInput').focus();
    return;
  }

  answered=true;
  $('answerInput').disabled=true;
  $('submitBtn').style.display='none';$('nextBtn').style.display='';
  const p=players[0];
  const correct=Math.abs(val-currentQ.a)<0.001;
  const fb=$('feedback');
  if(correct){
    p.score+=10*p.lv;p.correct++;p._lastCorrect=true;
    const nextLv=Math.min(p.lv+1,MAX_LEVEL);
    fb.className='fb show correct';
    fb.innerHTML=`Correct! &nbsp; Lv ${p.lv} → ${nextLv} &nbsp; (+${10*p.lv})`;
    sfxCorrect();
  }else{
    p.wrong++;p._lastCorrect=false;
    const nextLv=Math.max(p.lv-1,1);
    fb.className='fb show wrong';
    fb.innerHTML=`Wrong! &nbsp; Answer: ${fmt(currentQ.a)}<br>Lv ${p.lv} → ${nextLv}`;
    sfxWrong();
  }
  qCount++;
  renderScoreboards();

  if(qCount>=TOTAL_Q){
    setTimeout(showResult,1400);
    return;
  }
}

document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&$('gameScreen').classList.contains('active')){
    if(!answered)submitAnswer();
    else if($('nextBtn').style.display!=='none')nextQuestion();
  }
});

/* ========== 结算页面 ========== */
function showResult(){
  stopBGM();show('resultScreen');
  const rc=$('resultCard');let html='<h2>🏁 Game Over</h2>';
  const p=players[0];
  const acc=p.correct+p.wrong?Math.round(p.correct/(p.correct+p.wrong)*100):0;
  html+=`<div class="winner">Great job, ${p.name}!</div>`;
  html+=`<div class="final-scores"><div class="final-sb winner-box"><div class="fs-rank">#1</div><div class="fs-name">${p.name}</div><div class="fs-score">${p.score}</div></div></div>`;
  html+=`<div class="detail">✅ ${p.correct} &nbsp; ❌ ${p.wrong} &nbsp; Accuracy: ${acc}%<br>Final Level: ${p.lv}</div>`;

  if(p.score > TOTAL_Q*5) sfxVictory();
  else sfxDefeat();

  html+=`<div class="actions"><button class="btn btn-primary" onclick="goMenu()">Back to Menu</button><button class="btn btn-secondary" onclick="startSolo()">Play Again</button></div>`;
  rc.innerHTML=html;
}

// 生成浮动粒子
(function(){
  const container=document.getElementById('particles');
  if(!container)return;
  const count=36;
  for(let i=0;i<count;i++){
    const p=document.createElement('div');
    p.className='particle';
    p.style.left=Math.random()*100+'%';
    p.style.animationDuration=(Math.random()*15+10)+'s';
    p.style.animationDelay=(Math.random()*15)+'s';
    p.style.width=p.style.height=(Math.random()*3+1)+'px';
    container.appendChild(p);
  }
})();
</script>
